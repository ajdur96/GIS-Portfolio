e 25 miles between Salt Lake City and Lehi. The average number of commuters is taken from the Kem C. Gardner Policy Institute. In 2010, there were about 40,000 commuters between Salt Lake and Utah counties, about 6% of which took public transportation, walked, or biked. From the Taylor and Fink article, we know that monetary cost is of greater importance than travel time, but we don’t know by what margin. Therefore, the Time-Weight default value of 0.6 shows preference but is not necessarily a strong one. A default value for noise is difficult to determine, so a moderate noise value of 5 is used for the default value.  <\/p><p>The outputs of the model are two graphs and twelve numbers. The first graph compares the number of drivers to the number of train passengers every day. The second graph compares the C-factor to the T-factor. The twelve numerical outputs are driver count, train passenger count, threshold, and drive time statistics. The statistics include the standard deviation and mean over the run time and the final value. <\/p>"}, {"type": "caption", "html": "<p>Fig 2) A table of DESMOS curves  showing how the maximum and minimum of each variable affects the curve.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_2486/1679436332996.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 3) The screenshot of the model display with all outputs and default inputs.<\/p>"}, {"type": "heading", "text": "Results"}, {"type": "text", "html": "<p>The behavior space tool in NetLogo was used to observe each variable’s effect on drive time, threshold, and commuter decisions. The results are shown in figures 4 through 14 as charts. All variables were iterated through their range of values available in the model, and only one variable was changed at a time. This included six experiments with six outputs each, the mean and standard deviation of Drivers, Threshold, and Drive-Time. The results that came from changing the total amount of commuters often had a much more extensive range than the other variables, so most of the charts are displayed first with, then without, total commuters to have a better visualization.  <\/p><p>By looking at the charts, it becomes evident that the number of total commuters is the most influential variable in the model. When more commuters are added, drivers’ mean and standard deviation rise. Overall, increased total commuters indicate worse commuting time and a less stable number of drivers each day. In other words, on a good day, the commute would be bad, and on a bad day, it would be unbearable. The mean number of passengers is also included in the Mean Drivers graph because it is just the total minus the number of drivers in the others, but it is not as straightforward when the number of commuters changes.   <\/p><p>Three other variables react similarly to the total amount of commuters, albeit in a lesser magnitude. These are Time-Weight, interval, and train cost, which all seem to point positively or negatively together in every graph. They increase the mean and reduce the standard deviation of drivers and travel time, increasing the mean and standard deviation of the threshold. Of the three, Interval always has the steepest slope.  <\/p><p>The noise and C-cost are two variables with a somewhat different effect than the other variables. The noise variable is different from the other variables because it is meant to change the standard deviations of the various outputs but unexpectedly seems to change the means values slightly. Higher noise decreases the number of mean drivers and travel time very slightly. Excluding the variable for total drivers, noise is the most influential factor for all output standard deviations. C-cost is also about as significant as noise for the standard deviation of total drivers. C-cost also is the only variable that has a negative impact on mean drivers, mean travel time, and standard deviation of the threshold. <\/p><p>Based on the behavior space analyses, the number of total commuters seems to have the most influence, with the interval being the next most influential, then Time-Weight. Having a high C-cost and Noise and being low on the other variables appear ideal for promoting Frontrunner ridership. It is important to remember that the relative strengths of each of the variables shown in the graphs are all relative. They each show the range that is available in the model. The interval could have been between 15 and 120 rather than 15 and 180, which would make it appear to have a steeper slope. These graphs are not meant to be precise comparisons but rather to give a general idea of the magnitude and behavior of each variable. <\/p>"}, {"type": "heading", "text": "Drivers"}, {"type": "images", "items": [{"src": "images/widget_2488/1679437591713.png", "alt": "", "page": null}, {"src": "images/widget_2495/1679437610627.png", "alt": "", "page": null}, {"src": "images/widget_2498/1679437649181.png", "alt": "", "page": null}, {"src": "images/widget_2499/1679437667529.png", "alt": "", "page": null}]}, {"type": "heading", "text": "Travel Time"}, {"type": "images", "items": [{"src": "images/widget_2506/1679437795430.png", "alt": "", "page": null}, {"src": "images/widget_2507/1679437809777.png", "alt": "", "page": null}, {"src": "images/widget_2509/1679437824529.png", "alt": "", "page": null}, {"src": "images/widget_2510/1679437836937.png", "alt": "", "page": null}]}, {"type": "heading", "text": "Threshold"}, {"type": "images", "items": [{"src": "images/widget_2502/1679437689865.png", "alt": "", "page": null}, {"src": "images/widget_2503/1679437704644.png", "alt": "", "page": null}, {"src": "images/widget_2512/1681929154682.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 4-15) A series of graphs showing how the change in one variable affects the outputs. Each value was iterated through its entire range. Versions with and without total commuters allow for more detail to be shown.<\/p>"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>So, if the model is manipulated to have the most favorable results for Frontrunner ridership while remaining reasonable, how well would the Frontrunner perform? For this, we must assume new default values. A past bill has been proposed to double-track the Frontrunner, which will be taken to half the interval from 60 minutes to 30 (Webb 2021). The noise can rise from 5 to 6. C-cost can be calculated using current gas prices rather than last year, which would shift the value from 4.25 to 6.5 (AAA). Utah Transit Authority offers free fares in February, so the T-cost will be assumed to be 0 (Utah Transit Authority, 2022). If Senator Anderegg is correct and the population of his district will double in the next 30 years, the number of commuters will be assumed to double from 40,000 to 80,000. Finally, a public messaging campaign may shift the Time-Weight slightly, so it becomes 5.5 rather than 6. The results of that experiment can be seen below. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2512/1679437997418.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 16) A screenshot of the model display with the variables shifted to reflect a realistic scenario that favors frontrunner ridership. The result is a higher mean passenger value than the mean driver value. <\/p>"}, {"type": "text", "html": "<p>This results in having a higher mean passenger value than the mean driver value, although the values are very close. It is unlikely that there will ever be more commuters choosing public transit over their personal vehicle, but this is a powerful illustration of how favorable conditions can become for public transit. However, if nothing changes except the number of commuters, the mean driver time becomes about 44 minutes, a difference of about 12 minutes each way.<\/p><p>This study did not account for cyclical changes such as days of the week or time of year. Another limitation of this study is that currently, commuters only make decisions based on what happened the previous day. To make it more realistic, riders could make decisions based on what has happened during a set period in the past, such as a month. Lastly, this model only accounts for monetary cost and travel time when many more variables exist. Future studies could add values that represent the quality of the rider’s experience on the Frontrunner. Other limitations that would be difficult to include in a future model would be changes to conditions of driving personal vehicles, such as increased use of electric cars, more lanes added to the highways, or frequency of traffic accidents. <\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>This NetLogo model attempts to model Frontrunner Ridership between Salt Lake City and Lehi using primarily monetary cost and travel time values. This is meant to address the impending transportation crisis that legislators such as Jacob Anderegg predicted. If the population grows as expected, the strong influence of the number of commuters on travel time would undoubtedly indicate a crisis. The default values came from various sources such as the UTA website and Kem C. Gardener Policy Institute commuter report. This study has found that the right conditions would promote Frontrunner ridership, improving the commuting experience for those who use public transit and those who choose their vehicles. <\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>AAA. (2022, May 7). <em>Utah average gas prices<\/em>. AAA Gas Prices. Retrieved May 7, 2022, from <a href=\"https://gasprices.aaa.com/?state=UT\" target=\"_blank\" rel=\"noopener\">https://gasprices.aaa.com/?state=UT<\/a>  <\/p><p>Bateman, M., &amp; Young, N. (2010, January). Moving toward 2020: Utah Commuting Patterns, 2000 to 2010. Retrieved May 7, 2022, from <a href=\"https://gardner.utah.edu/wp-content/uploads/CommutingReport-Jan2020.pdf\" target=\"_blank\" rel=\"noopener\">https://gardner.utah.edu/wp-content/uploads/CommutingReport-Jan2020.pdf<\/a>  <\/p><p>Taylor, B. D., &amp; Fink, C. N. (2003). The factors influencing transit ridership: A review and analysis of the ridership literature. <\/p><p>Taylor, B. D., Miller, D., Iseki, H., &amp; Fink, C. (2009). Nature and/or nurture? Analyzing the determinants of transit ridership across US urbanized areas. Transportation Research Part A: Policy and Practice, 43(1), 60-77. <\/p><p>Webb, L. V. (2021, January 27). Analysis: Anderegg says exploding growth means he can’t wait years and year for transportation funding. Utah Policy. Retrieved March 7, 2022, from <a href=\"https://utahpolicy.com/archive/26142-analysis-anderegg-says-exploding-growth-means-he-can-t-wait-years-and-year-for-transportation-funding\" target=\"_blank\" rel=\"noopener\"> <\/a><a href=\"https://utahpolicy.com/archive/26142-analysis-anderegg-says-exploding-growth-means-he-can-t-wait-years-and-year-for-transportation-funding\" target=\"_blank\" rel=\"noopener\">https://utahpolicy.com/archive/26142-analysis-anderegg-says-exploding-growth-means-he-can-t-wait-years-and-year-for-transportation-funding<\/a><a href=\"https://utahpolicy.com/archive/26142-analysis-anderegg-says-exploding-growth-means-he-can-t-wait-years-and-year-for-transportation-funding\" target=\"_blank\" rel=\"noopener\"> <\/a>. <\/p><p>Utah Transit Authority. (2022, April). Free fare February. UTA. Retrieved May 7, 2022, from <a href=\"https://www.rideuta.com/Rider-Info/Free-Fare-February\" target=\"_blank\" rel=\"noopener\">https://www.rideuta.com/Rider-Info/Free-Fare-February<\/a>  <\/p><p>Utah Transit Authority. (n.d.). Current Fares. UTA. Retrieved May 7, 2022, from <a href=\"https://www.rideuta.com/fares-and-passes/current-fares\" target=\"_blank\" rel=\"noopener\">https://www.rideuta.com/fares-and-passes/current-fares<\/a>  <\/p><p>Utah Transit Authority. (n.d.). Current Fares. UTA. Retrieved May 7, 2022, from <a href=\"https://www.rideuta.com/Rider-Tools/Schedules-and-Maps/750-FrontRunner\" target=\"_blank\" rel=\"noopener\">https://www.rideuta.com/Rider-Tools/Schedules-and-Maps/750-FrontRunner<\/a><\/p>"}]}, "page_38": {"id": "page_38", "label": "GEOG 6161 - Capstone in GIS", "blocks": [{"type": "text", "html": "<p>GEOG 6161 - Capstone in GIS:<\/p><p>Digitization of Scanned Flood Maps<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Spring 2023", "Professor: Phoebe McNealy"]}, {"type": "skills", "items": ["Spatial Data & Algorithms", "GIS Workflow", "Project Design", "Project Management", "Communication Skills"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>The Utah Division of Emergency Management (DEM) is a government agency that manages flood maps in Utah for the Federal Emergency Management Agency (FEMA). The vision of the Utah Risk Mapping, Assessment, and Planning (Risk MAP) Program is to ensure that communities within Utah are informed of their flooding risks. Flood maps are, in most cases, the only resource a city or county has that assesses the flood risk within their community. While recent flood maps are hosted in the Digital Flood Insurance Rate Map (DFIRM) database and can be easily viewed and used, 143 authoritative flood maps created in the 1970s and 1980s remain available only as scanned images.<\/p><p>This project georeferences and digitizes the scanned image flood maps for the Utah DEM. Local communities will use these maps to determine building standards, land use planning, and evacuation planning. State agencies will use the maps to identify state-owned facilities within flood zones to ensure they are properly built. The state will also use these maps to identify flood designation changes. Although the possibility of using machine learning to automate this process was explored, this project ultimately accomplished its goals by manually georeferencing and digitizing as many flood maps as time restraints allowed.<\/p>"}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p>Georeferencing is the process of assigning real-world coordinates to pixels in a digital image, in this case, the FEMA flood maps. This allows the image to be displayed on a map and where the floodplain features could be digitized.<\/p><p>Control points are points used to georeference the scanned flood maps onto a coordinate system. They are typically points that are easy to identify on both the image and the reference map. For example, placing a control point at the intersection of two paved streets is useful since these are unlikely to shift over the years, unlike dirt roads and streams. UGRC’s 1990s aerial imagery was used as the reference map to match these man-made features. The Public Land Survey System has Section Township Range lines that are also useful for this purpose. The desired number of control points for each flood map is 8, which is impossible for all maps since some have few or none of these features. When a map could not provide a sufficient number of locations for accurate control points, these flood maps were left so that more progress could be made on maps that are less effort intensive. <\/p><p>Root Mean Square Error (RMSE) is a value that indicates the accuracy of a georeferenced image. Generally, the lower the RMSE, the more accurate the georeferencing. To calculate the RMSE, you will need to identify a number of control points on both the image and the reference map. One finds the RMSE by calculating the mean of the residual number of pixels between the control points on the image and the corresponding points on the reference map, then take the square root of that mean. In ArcGIS Pro, this is done automatically. However, it is common to have a low RMSE but still have an inaccurate georeferenced image. This happens when the control points are not evenly distributed or if there are errors in the coordinates of the control points. Flood maps were not digitized until they both had a low RMSE and had there scanned map features visually aligned with features on the reference map.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_7909/1680979757311.png", "alt": "", "page": null}, {"src": "images/widget_7911/1680979785861.png", "alt": "", "page": null}, {"src": "images/widget_7913/1680979899969.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>A map of Beaver, UT. This is an example of a map that is simple to georeference and digitize because of the many intersections and small flood zone, respectively.<\/p>"}, {"type": "text", "html": "<p>A map of Antimony, UT. This is an example of a flood map that is more difficult to georeference and digitize because of the few reference points and large flood zone, respectively.<\/p>"}, {"type": "text", "html": "<p>A map of an unincorporated area in Garfield County, UT. This example is representative of what a majority of the maps in this project. It was roads and PLSS Section Township Range Lines that can be used to georeferenced, and has a large polygon to be digitized. <\/p>"}, {"type": "text", "html": "<p>DIGITIZING <\/p><p>     Digitizing is the process of creating polygons, lines, or points that represent geographical data. In this case, this means pointing and clicking to define the vertices of the flood plains, cross sections, base flood elevations, and tribal areas from the georeferenced maps. When digitizing, it is important to be accurate to minimize error. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7907/1680979337475.png", "alt": "", "page": null}, {"src": "images/widget_7908/1680979484490.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>This figure contains two digitized flood maps at the same scale to compare complexity. The left map is a single flood zone in Iron County that required very little time to complete, while the map on the right has 4 different flood zones, cross sections, base flood elevations, and tribal areas that took much more time and attention to detail.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_7954/1683578826272.png", "alt": "", "page": null}, {"src": "images/widget_7955/1683578904853.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>Low resolution and other features obscuring flood zone boundary<\/p>"}, {"type": "heading", "text": "Overlapping flood zones from bordering maps"}, {"type": "images", "items": [{"src": "images/widget_7960/1683578965644.png", "alt": "", "page": null}, {"src": "images/widget_7961/1683579007090.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>Overlapping flood zones from county vs city maps of different years<\/p>"}, {"type": "heading", "text": "Jagged flood zone edges at a map border"}, {"type": "images", "items": [{"src": "images/widget_7920/1680980772720.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>ATTRIBUTE POPULATION<\/p><p>Once the feature is digitized, its attributes are populated to preserve as much of the information from the paper map as possible. Some attributes were created to match with the FIRM Database, while other populated attributes were done at the request of DEM. Attributes for cross sections and base flood elevations included their label, tributary and panel number. Other attributes that the DEM requested that were added to each flood zone polygon were community ID, community name, and county name.<\/p>"}, {"type": "text", "html": "<p>A portion of a table from the Flood Insurance Rate Map (FIRM) Database Technical Reference that gives a description of attributes for flood zones in the DFIRM database.<\/p>"}, {"type": "heading", "text": "Results"}, {"type": "text", "html": "<p>Of the 143 flood map panels that existed only as scanned images, this project georeferenced a total of 73 maps and digitized and populated the attributes of 40 of those. The estimated average time for georeferencing, digitizing, and populating the attributes for one image are 20 minutes, 1 hour, and 15 minutes respectively. These come from timing the work on the first 20 maps. This means that about 75 hours went into this project. With those same values, an estimated 150  hours of labor remain before every flood map panel is digitized. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7930/1683579081910.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>A graph showing the work completed in each county, ordered by priority.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_7979/1683579156875.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>A map of Iron County Utah showing the area covered by the flood maps and the digitized flood zones.<\/p>"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>In its initial stages, this project explored the possibility of using machine learning to automate the processes of georeferencing and digitizing. The arcgis.learn scannedmapdigitizer Python code is a powerful tool that can be used to georeference and digitize some scanned maps automatically, and it could be adapted for these maps. It offers such advantages as processing multiple maps simultaneously and using a sophisticated georeferencing algorithm. However, its drawbacks include that the machine-learning method would require preprocessing all scanned map images so that different colors represent different flood zones. Test images had their color changed in Adobe Photoshop. It also was hindered by expecting to use coastlines to georeference the maps, which would need to be substituted with a feature such as buffered road centerlines for Utah. However, this portion of the code was never tested. The machine-learning method was eventually abandoned before it fully functioned as there was no guarantee of having fully functional code before the end of this project.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_7925/1680981932346.jpg", "alt": "", "page": null}, {"src": "images/widget_7926/1680981996683.jpg", "alt": "", "page": null}, {"src": "images/widget_7927/1680982303412.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>This shows the progression of a test flood map image as it was run in the code. First is the unaltered original image. Second is the same image after preprocessing to color code the flood zone and eliminate extraneous borders and text. The last image is the mask output that would be used in the automated digitization. The next step would have been another mask output that would have contained the streets, but this step was never successfully completed in this project.<\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>Thanks to the sponsorship of The Utah Division of Emergency Management, this project has been a success. Out of 143 flood maps, about one-third, were georeferenced, digitized, and populated with attributes. 30 more have been georeferenced, and all have been verified for accuracy. These digital features will be a valuable resource to Utah residents by making important floodplain information more accessible. Local communities will use the maps for land use planning, evacuation planning, and building standards. State agencies will use the digitized maps to ensure that state-owned facilities within the floodplain are properly built and to create a report identifying flood designation changes. While the digital flood zones will be more convent, it is important to acknowledge that they have no legal authority. The scanned flood maps should still be referenced and relied on for final legal decisions. <\/p>"}]}, "page_21": {"id": "page_21", "label": "GEOG 6165 - Data Visualization", "blocks": [{"type": "text", "html": "<p>GEOG 6150 - Data Visualization:<\/p><p>Visualizing Alcohol Outlet Legal Proximity Through Service Areas<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Spring 2022", "Professor: Alexander Hohl"]}, {"type": "skills", "items": ["GIS Analysis", "GIS Workflow", "Cartography & Graphic Design", "Spatial Analysis", "Communication Skills"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>Utah has a reputation for having harsh alcohol laws. Increased alcohol consumption can be detrimental to public health, especially when underage drinking is present. To fortify the state against these adverse effects, Utah has laws that determine how far away alcohol outlets are permitted to be from community centers. These laws are meant to limit the adverse public health effects of alcohol outlet proximity and density. However, even though Utah has strict proximity restrictions regarding on-premises alcohol outlets, community centers are still near alcohol outlets in the form of off-premises alcohol outlets and on-premises alcohol outlets with legal exceptions. In this study, a service area analysis and buffers are used to simulate the proximity zones of alcohol outlets to determine how well those zones protect community centers.<\/p>"}, {"type": "heading", "text": "Literature Review"}, {"type": "text", "html": "<p>In 2017 the proximity restrictions on alcohol licenses changed so that restaurants no longer had to be 600 feet of walking distance from community centers but could be 300 feet away (Mckitrick, 2017). The 600-foot distance held for bars, however. Also, both bars and restaurants must still be within 200 feet Euclidean distance from the community centers (DABC, 2022). The DABC defines a community center as “a church, public or private school, a public park, public playground or a library.” (DABC, 2022). These restrictions are subject to exceptions, such as if the community center is established after the alcohol outlet has its license (DABC). The 2017 change happened even though an assessment conducted at BYU about mitigating the adverse effects of alcohol outlet density suggests maintaining the current proximity restrictions (Payne et al., 2013). <\/p><p>Alcohol outlets are legally restricted because high alcohol outlet density has been shown to have a clear association with adverse public health effects such as violence and disease (Campbell, et al., 2009; Gorman, et al., 1998; Gruenewald, et al., 2006; Gyimah-Brempong &amp; Racine, 2006; Livingston, 2008; Livingston, et al., 2007; McKinney, et al., 2009; Popova, et al., 2009). Of particular concern is underage drinking because it interrupts brain development and makes teens far more likely to engage in risky activities (Martín-Turrero, et al., 2022; Wagenaar, et al., 1996; Williams, et al., 2005). Alcohol use at an early age also predicts alcohol use disorder as an adult (Ystrom et al., 2014).<\/p>"}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p>Before the proximity areas can be defined, the community centers must be put into the proper format. Of the community centers that restrict alcohol outlet location (libraries, schools, places of worship, and parks), only parks were available as polygons. Therefore, to define polygons for all other community centers, the point data were used to select all parcels in a county with at least one community center point.<\/p><p>Three separate proximity areas were defined in this study. The first is determined by laws that designate an area where no on-premises alcohol can be served. This is 300 feet walking distance and 200 feet Euclidean distance (Proximity Restrictions, 2020). This will be referred to as the “prohibited zone.” The next zone is where restaurant outlets are permitted, but bars are still prohibited. This is 600 feet walking distance and 200 feet Euclidean distance. This zone will be referred to as the “limited zone.” The final proximity zone will be called the “catch zone.” It is not defined by law but rather an attempt to catch all outlets that lie just outside the other zones. For this study, the catch zone is defined as 1200 feet network distance and 600 feet Euclidean distance.<\/p><p>The service area was conducted at standard precision for 300 feet, 600 feet, and 1200 feet using the rings setting so that there was no overlap. The 300-foot service area was merged and dissolved with the 200-foot buffer, and the same was done with the 1200-foot service area and the 600-foot buffer. The erase tool was then used on the larger zones by any zone smaller than it to ensure no overlap.  <\/p><p>The proximity zones are then complete and ready for further analysis. The primary question is how best to visualize the information for making the dashboard. The primary audience of this dashboard would likely be counties or municipalities that are using this information to inform decision-making or as a launching point for their analysis. For that reason, the dashboard will focus on descriptive visualization for when it is zoomed in rather than when it is zoomed out.<\/p><p>Next, the color scales were selected to make them more intuitive to the user. A yellow-red color scale is used for the alcohol outlets, and a light blue-dark blue color scale is used for the proximity zones and community centers. The bright red is used for outlets closer to community centers to indicate more danger, while the yellow indicates less. For the community centers, the darker blue is used for the prohibited zone to draw more attention, while the lighter blues are used to frame it. The same dark blue is used for the community centers to reduce the number of colors on the map to reduce confusion. Different icons are used for all the community centers and the various alcohol outlets.  <\/p><p>The finished dashboard has three graphs that can filter the outlet visible by which proximity zone it falls under. A layer toggle also allows features to be taken off the map to improve visualization. Zooming in and out of the map will likewise filter the graphs to only display outlets within the map frame. The fact that interacting with one visualization will make changes in the map technically make this an example of geovisual analytics, albeit a limited one with only one map and three graphs to view the data (Robinson, 2017).  <\/p>"}, {"type": "embed", "src": "https://www.arcgis.com/apps/dashboards/2958a5fb30f242959f5b36f9ddf4d405"}, {"type": "heading", "text": "Results"}, {"type": "text", "html": "<p>The analysis results find that 241 (17.7%) restaurants and 101 (26.4%) bars lie outside their legal limit. This comes to 342 (19.6%) on-premises outlets that have an exception to the proximity laws. In addition to this, 380 (21.6%) off-premises outlets would be outside the limits if they had the same restrictions as bars, and 468 (26.6%) would be outside the boundary if they had the same restrictions restaurants. 19.6% of on-premises outlets being closer than legally allowed is a high figure, especially considering that in only 2017, the regulations were even tighter. This is likely because many, if not all, of these outlets, were established before the community centers. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2786/1679449586513.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 1)  A table showing how many of each outlet type are found in each proximity zone. Green are outlets that are located legally, red are outlets that are located illegally unless they have an expeption.<\/p>"}, {"type": "text", "html": "<p>As an example of the dashboard in action, we will examine some of the findings of bars in the prohibited zone. Someone in Salt Lake County may be interested in schools near bars. To investigate the high count of bars, a filter can be set to only show bars within the prohibited zone, and all other outlets can be toggled off to increase visibility. Upon doing this and zooming into a cluster of bars, in Salt Lake City, 9 of out of bounds bars are found to be excluded because of the same school. By clicking on the school, we can see that it was established in 2015. We do not know when the bars obtained their alcohol licenses, but since the school was established recently, all these bars likely have legal exceptions. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_1141/1679423880647.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 2) A screenshot showing an area where there are a high number of bars that are within the prohibited zone.<\/p>"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>Future research for this project would include gathering more specific data about the 342 alcohol outlets that seem to lie outside their legal boundaries. A more local analysis could be performed to see if there is any clustering of these exceptions. Research could be done to find their common characteristics; for example, it may be that those bars and restaurants tend to be older than a particular year. Research on the community centers could also be done to see if a specific community center tends to have alcohol outlets nearer than others. This has been an overview study of Utah, but it could be a useful starting point for counties or municipalities that wish to conduct their research for their areas. Finally, since alcohol outlets aren’t necessarily the point where minors obtain their alcohol, further investigation is required to understand how alcohol outlet density relates to the social factors that provide adolescents with alcohol.  <\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>Alcohol outlets are not permitted near community centers for two main reasons. The first is to reduce the alcohol outlet density since that has consistently been correlated with adverse public health effects, as discussed in the literature review. The second reason is to increase the distance between the underage population and places where they might gain access to alcohol since the adverse effects of alcohol are exceptionally prominent for underage drinkers. There is access to alcohol outlets near underage gathering points that aren’t covered in Utah law. Some are legal on-premises exceptions to the law, while some are off-premises outlets that the law does not seem concerned about addressing. The statistics for the whole state give a good overview of the situation while having a dashboard with filters appears to be an effective way to explore smaller areas more in-depth. This dashboard is a tool that residents can use to explore the alcohol outlets near them. It may be that some of the outlets that lie incredibly close to community centers must be addressed. Still, even if the law is not invoked, this tool will allow Utahns to make more informed decisions about their children and alcohol.<\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>Campbell, C. A., Hahn, R. A., Elder, R., Brewer, R., Chattopadhyay, S., Fielding, J., ... &amp; Task Force on Community Preventive Services. (2009). The effectiveness of limiting alcohol outlet density as a means of reducing excessive alcohol consumption and alcohol-related harms. American journal of preventive medicine, 37(6), 556-569. <\/p><p>Gorman, D. M., Speer, P. W., Labouvie, E. W., &amp; Subaiya, A. P. (1998). Risk of assaultive violence and alcohol availability in New Jersey. American journal of public health, 88(1), 97-100. <\/p><p>Gruenewald, P. J., Freisthler, B., Remer, L., LaScala, E. A., &amp; Treno, A. (2006). Ecological models of alcohol outlets and violent assaults: crime potentials and geospatial analysis. Addiction, 101(5), 666-677. <\/p><p>Gyimah-Brempong, K., &amp; Racine, J. (2006). Alcohol availability and crime: a robust approach. Applied Economics, 38(11), 1293-1307. <\/p><p>Livingston, M. (2008). Alcohol outlet density and assault: a spatial analysis. Addiction, 103(4), 619-628. <\/p><p>Livingston, M., Chikritzhs, T., &amp; Room, R. (2007). Changing the density of alcohol outlets to reduce alcohol‐related problems. Drug and alcohol review, 26(5), 557-566. <\/p><p>Martín-Turrero, I., Valiente, R., Molina-de La Fuente, I., Bilal, U., Lazo, M., &amp; Sureda, X. (2022). Accessibility and availability of alcohol outlets around schools: An ecological study in the city of Madrid, Spain, according to socioeconomic area-level. Environmental research, 204, 112323. <\/p><p>McKinney, C. M., Caetano, R., Harris, T. R., &amp; Ebama, M. S. (2009). Alcohol availability and intimate partner violence among US couples. Alcoholism: Clinical and Experimental Research, 33(1), 169-176. <\/p><p>Mckitrick, C. (2017, March 20). Utah's shorter proximity rule could still leave some restaurants without alcohol. standard.net. Retrieved May 3, 2022, from <a href=\"https://www.standard.net/news/government/2017/mar/20/utahs-shorter-proximity-rule-could-still-leave-some-restaurants-without-alcohol/\" target=\"_blank\" rel=\"noopener\">https://www.standard.net/news/government/2017/mar/20/utahs-shorter-proximity-rule-could-still-leave-some-restaurants-without-alcohol/<\/a>  <\/p><p>Pauwels, K., Ambler, T., Clark, B. H., LaPointe, P., Reibstein, D., Skiera, B., Wierenga, B., &amp; Wiesel, T. (2009). Dashboards as a Service: Why, What, How, and What Research Is Needed? Journal of Service Research, 12(2), 175–189. <a href=\"https://doi.org/10.1177/1094670509344213\" target=\"_blank\" rel=\"noopener\"> <\/a><a href=\"https://doi.org/10.1177/1094670509344213\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1177/1094670509344213<\/a><a href=\"https://doi.org/10.1177/1094670509344213\" target=\"_blank\" rel=\"noopener\"> <\/a><\/p><p>Payne H, Davis S, Moxley V, Tengelsen S, Call L. Assessing Alcohol Policy in Utah: A Health Impact Assessment. Brigham Young University, Dec 2013. <\/p><p>Popova, S., Giesbrecht, N., Bekmuradov, D., &amp; Patra, J. (2009). Hours and days of sale and density of alcohol outlets: impacts on alcohol consumption and damage: a systematic review. Alcohol &amp; Alcoholism, 44(5), 500-516. <\/p><p>Proximity restrictions. Utah Department of Alcoholic Beverage Control. (2020, February 25). Retrieved May 6, 2022, from <a href=\"https://abc.utah.gov/licenses-permits/proximity-restrictions/\" target=\"_blank\" rel=\"noopener\">https://abc.utah.gov/licenses-permits/proximity-restrictions/<\/a><\/p><p>Robinson, A. (2017). Geovisual Analytics. The Geographic Information Science &amp; Technology Body of Knowledge (3rd Quarter 2017 Edition), John P. Wilson (ed.). doi: 10.22224/gistbok/2017.3.6. <\/p><p>Robison-Greene, R. (2017) Alcohol Legislation in Utah: Drunk with Power?. The prindle post. <\/p><p>Utah Department of Alcoholic Beverage Control. (2020, February 25). Utah Admin Code R82-1. Utah Office of Administrative Rules. Retrieved May 4, 2022, from <a href=\"https://abc.utah.gov/wp-content/uploads/Compliance/UsefulLinks/R82-Rules.pdf\" target=\"_blank\" rel=\"noopener\">https://abc.utah.gov/wp-content/uploads/Compliance/UsefulLinks/R82-Rules.pdf<\/a>  <\/p><p>Utah Department of Alcoholic Beverage Control. (2021, December 13). Licenses &amp;amp; permits. Utah's DABC. Retrieved December 13, 2021, from <a href=\"https://abc.utah.gov/licenses-permits/#current-licensees-header.\" target=\"_blank\" rel=\"noopener\">https://abc.utah.gov/licenses-permits/#current-licensees-header.<\/a>  <\/p><p>Utah Geospatial Resource Center. (n.d.). Data. Utah GIS Portal. Retrieved December 13, 2021, from <a href=\"https://gis.utah.gov/data/\" target=\"_blank\" rel=\"noopener\"> <\/a><a href=\"https://gis.utah.gov/data/\" target=\"_blank\" rel=\"noopener\">https://gis.utah.gov/data/<\/a><a href=\"https://gis.utah.gov/data/\" target=\"_blank\" rel=\"noopener\"> <\/a>. <\/p><p>Wagenaar, A. C., Toomey, T. L., Murray, D. M., Short, B. J., Wolfson, M., &amp; Jones-Webb, R. (1996). Sources of alcohol for underage drinkers. Journal of studies on alcohol, 57(3), 325-333. <\/p><p>Williams, S. S., &amp; Mulhall, P. F. (2005). Where public school students in Illinois get cigarettes and alcohol: characteristics of minors who use different sources. Prevention Science, 6(1), 47-57. <\/p><p>Ystrom, E., Kendler, K. S., &amp; Reichborn‐Kjennerud, T. (2014). Early age of alcohol initiation is not the cause of alcohol use disorders in adulthood, but is a major indicator of genetic risk. A population‐based twin study. Addiction, 109(11), 1824-1832. <\/p>"}]}, "page_59": {"id": "page_59", "label": "CMP 6720 - Land Use & Transportation Planning", "blocks": [{"type": "text", "html": "<p>CMP 6760 - Land Use &amp; Transportation Planning:<\/p><p>Measuring Street Connectivity in Washington, DC, Through SQL<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Spring 2023", "Professor: Reid Ewing"]}, {"type": "skills", "items": ["Cartography & Graphic Design", "Data Models & Structures", "Database Design", "SQL", "Communication Skills"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>I chose this project because in the late summer of 2023, I intend to relocate to Washington, DC, to start my career in GIS. Washington, DC is one of the largest and oldest planned street grids in the United States. That grid pattern has served the city well as it grew, keeping the street connectivity high. It is most desirable to live in an area with high street connectivity. Street connectivity correlate with being more walkable and livable. It reduces traffic congestion by presenting alternative routes. It promotes health in the resident by making it easier to participate in active transportation like walking and biking. Often it makes transit more accessible as well. This research project aims to examine street connectivity in Washington, DC, through an SQL database. Results are presented as the city's most connected and least connected census blocks based on four measures of connectivity; average block size, intersection density, street density, and link-to-node ratio. The PostGIS extension of PostgreSQL is used because it is a powerful tool to organize and analyze geographic and nongeographic data. The database relates datasets together to calculate the measures of connectivity and rank census blocks by those measures.<\/p>"}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p>This project uses four quantitative measures of street connectivity. Each measure is used individually to determine street connectivity throughout the city, then combined to create a composite connectivity score for each census tract. The measures combine to create a composite measure by ranking each census tract from most connective to least connective according to each measure. A sum of the rankings will perform as the overall score, meaning the lower the score, the more connective the census tract is. The lowest and most connective possible score is 4, while the highest possible score is 824 (206 census tracts * 4 measures). The four individual measures of connectivity are as follows:<\/p><ol><li>Mean city block size<\/li><li>Intersection count/area<\/li><li>Intersection county/road segment count<\/li><li>Roadway mileage/area<\/li><\/ol><p>All necessary data was available or could be created from data available on a public data site maintained by the District of Columbia government (District Department of Transportation, 2022). This included three feature layers. <\/p><p>1) Washington DC Road centerlines<\/p><p>2) Washington DC roadway polygons<\/p><p>3) Washington DC 2020 Census Tracts. <\/p><p>These datasets are imported into ArcGIS Pro so that they can be prepared before they are used in the SQL database. First, the road centerlines are needed to create the intersection nodes and street segments. Nodes also include nodes at dead ends that connect only two line segments. Since the measurement calculations only require nodes that represent intersections, the line segments are spatially joined to the nodes in order to have an attribute that represents the number of line segments that touch the node. A definition query then easily filters out all nodes that touch less than 3 line segments. Next, the roadway polygons and census tracts will be used to create the street blocks. A definition query is used on the roadway polygons to exclude anything that is not truly part of the road, such as alleyways. What remains is then subtracted from the census blocks to create the city blocks. Lastly, the original census tract polygons need no preparation. <\/p><p>Once all the datasets are prepared, they are imported into the PostGIS server through QGIS, an open-source GIS software that can connect to PostGIS. The writing and testing of the SQL code are then conducted in PgAdmin, another software that can connect to the server. In PgAdmin, running the necessary code creates four tables, one for each feature layer imported through QGIS. Each table has the necessary attributes. Most information is stored in the census tract table, but the city block table stores the block size, the node table stores the number of street segments connecting to each node, and the road segment table stores the mileage of each road segment. Each feature has its spatial reference set to 4326 to ensure consistency. Then a spatial index is created for each table to speed up processing. Joins can then be used to relate the tables together. Creating a left join while spatially selecting the features within the census tract using the ST_Contains() function gives the desired result. This is done for city block, node, and roadway segment tables. These are one-to-many joins that are used to relate all points, line segments, and city blocks to the census tract to which they belong. A visualization of the database is shown below.<\/p>"}, {"type": "text", "html": "<p>The data is then ready to calculate the connectivity measures. To start, the total area of the census tracts and city blocks is calculated using the ST_Area() function. Next, the mileage for each street segment is calculated using the ST_Length() function. Counts of each census tract's total nodes and segments are then computed using the ST_Contains() function. This will quickly become out of date, but since this project’s scope is only to capture an instant in time, this method will suffice. Finally, all these are used to create the connectivity measures using simple algebra. The code sorts each connectivity measure from most to least connective and gives them a rank in another field using the DENSE_RANK() function. These ranks are then summed to create our composite measure of connectivity. The data is then ready to be transferred back to ArcGIS Pro, symbolized, and formatted into a series of maps to make the results more easily interpreted and communicated. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7945/1681234881385.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 3) A visualization of the SQL database schema showing how each feature class relates to the others.<\/p>"}, {"type": "heading", "text": "Results"}, {"type": "text", "html": "<p>The deliverables for this project are six maps that show the result of the analysis. Four of the maps are the census blocks colored by their rank for each of the four individual connectivity measures. The last two are maps that show the five most and least connective census blocks according to the sum of the ranks. <\/p><p>From the four connectivity measure maps, it is evident that each connectivity measure finds generally the same pattern of high connectivity in the center of the city and lower connectivity on the edges of the city. However, the top five ranked census tracts for each measure turn out to be quite different. In fact, only two census blocks appear in multiple top five lists. These are tract numbers 005502 and 008410. The former is ranked second overall and is found near Dupont Circle. It was ranked third in nodes per area and fifth in roadway per area. It had a well ranked sixth in mean block size, but fell short in nodes per segment landing 45th. If it weren’t for that final score, it would likely be the most connective census tract as it falls just 2 points short of the top node.The latter is ranked third overall and is found in the Atlas District. It was fourth for both roadway per area and nodes per area. All other highlighted census blocks only appear in one top five list. <\/p><p>Each connectivity measure map has an aspect that sets it apart from the others. The nodes per segment map rank in the middle an area that includes part of the river which is ranked low on by all the other mesures. Nodes per area show higher connectivity along the Northeastern border than the other maps do. Mean block size includes an area in the top five that is ranked low on all other maps. This lack of consensus between the different measures in specific rankings but overall consensus in general pattern reinforced the methodology of using a composite measure to determine the overall connectivity ranking. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7932/1680984833913.png", "alt": "", "page": null}, {"src": "images/widget_7933/1680984879186.png", "alt": "", "page": null}, {"src": "images/widget_7935/1680984932294.png", "alt": "", "page": null}, {"src": "images/widget_7936/1680985006824.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 4-7) Four maps each showing an individual connectivity measure with each census tract have a lighter color for higher (more connective) connectivity rank. <\/p>"}, {"type": "text", "html": "<p>Since each connectivity map has the same general pattern, it is no surprise that the sum of ranks maps look very similar to all of them. There is a “L” shape of high connectivity in the center of the city and lower connectivity around it. Through a quick visual examination, it appears that roadway per area is the single measure that best matches the composite measure. However, this would need more rigorous statistics to confirm. <\/p><p>The first and fifth most connective census blocks are near Logan Circle, while the second and fourth ranked census blocks are near Dupont Circle. The third ranked census block is further away from the others in an area called the Atlas District. As for the least connective census blocks, three are on an outside edge with two of those capturing part of the Potomac River. The last two are clustered together in and area called Cleveland Park.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_7938/1680985119530.png", "alt": "", "page": null}, {"src": "images/widget_7939/1680985152825.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 8-9) Two copies of a map showing the sum of all connectivity measure ranks. The top map shows the five census tracts with the lowest sum (most connective), and the bottom map shows the census tracts with the highest sum (least connective). Charts connected to each highlighted census tract area show what that rea was ranked in each connectivity measure.<\/p>"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>Some of the least connective areas have natural areas that block connectivity, like the potomac river, rock creek park and the national arboretum. This means that while they may not have street connectivity, they may still be walkable and provide similar benefits that highly connective areas do such as promoting active transportation. It is possible that there is a connectivity measures that could be used to take this into account.<\/p><p>One limitation of this study is the connectivity measures. The different connectivity measures used here can find different results. Without understanding which one is best or what each measure truly measures means that each measure is given equal weight in the composite measure when it may be smarter to give certain measures higher weights. Also, there are far more connectivitivty measures than used here. Other connectivity measures that are more sophisticated than what are used in this study could provide a more nuanced view of street connectivity. All of this considered, we cannot definitely say that the most connective census tracts found in this study and truly the most connective. The general pattern is most likely sound, but the specifics may change much.<\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>This paper has examined street connectivity in Washington, DC, through an SQL database. Results are presented as the city's most connected and least connected census blocks based on four measures of connectivity; average block size, intersection density, street density, and link-to-node ratio. PostGIS has proven to be a powerful tool to process geographical data, and undoubtedly has other applications for land use and transportation planning. This study provides valuable information about street connectivity in Washington, DC. The results can be used to inform residents or future residents of the city about which locations are most walkable, bikeable, and livable.<\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>Berrigan, D., Pickle, L. W., &amp; Dill, J. (2010). Associations between street connectivity and active transportation. <em>International journal of health geographics<\/em>, <em>9<\/em>, 1-18.<\/p><p>Choi, D. A., &amp; Ewing, R. (2021). Effect of street network design on traffic congestion and traffic safety. <em>Journal of transport geography<\/em>, <em>96<\/em>, 103200.<\/p><p>District Department of Transportation. (2022, July 5). <em>Pedestrian friendliness index census blocks<\/em>. Open Data DC. Retrieved March 29, 2023, from <a href=\"https://opendata.dc.gov/datasets/DCGIS::pedestrian-friendliness-index-census-blocks/about\" target=\"_blank\" rel=\"noopener\">https://opendata.dc.gov/datasets/DCGIS::pedestrian-friendliness-index-census-blocks/about<\/a> <\/p><p>Erath, A., van Eggermond, M. A., Fourie, P. J., &amp; Chakirov, A. (2013, April). Decision support tools in transport planning: from research to practice. In <em>13th Swiss Transport Research Conference, Ascona<\/em>.<\/p><p>Ferreira Jr, J., Diao, M., Zhu, Y., Li, W., &amp; Jiang, S. (2010). Information infrastructure for research collaboration in land use, transportation, and environmental planning. <em>Transportation research record<\/em>, <em>2183<\/em>(1), 85-93.<\/p><p>Galpern, P., Ladle, A., Uribe, F. A., Sandalack, B., &amp; Doyle-Baker, P. (2018). Assessing urban connectivity using volunteered mobile phone GPS locations. <em>Applied geography<\/em>, <em>93<\/em>, 37-46.<\/p><p>Grengs, J., Levine, J., Shen, Q., &amp; Shen, Q. (2010). Intermetropolitan comparison of transportation accessibility: sorting out mobility and proximity in San Francisco and Washington, DC. <em>Journal of Planning Education and Research<\/em>, <em>29<\/em>(4), 427-443.<\/p><p>Knight, P. L., &amp; Marshall, W. E. (2015). The metrics of street network connectivity: their inconsistencies. <em>Journal of Urbanism: International Research on Placemaking and Urban Sustainability<\/em>, <em>8<\/em>(3), 241-259.<\/p><p>L'Enfant, P. C. &amp; Thackara &amp; Vallance. (1792) Plan of the city of Washington. [Philadelphia: s.n] [Map] Retrieved from the Library of Congress, <a href=\"https://www.loc.gov/item/88694159/\" target=\"_blank\" rel=\"noopener\">https://www.loc.gov/item/88694159/<\/a>.<\/p><p>Peterson, J. A. (1985). The Nation's First Comprehensive City Plan A Political Analysis of the McMillan Plan for Washington, DC, 1900-1902. <em>Journal of the American Planning Association<\/em>, <em>51<\/em>(2), 134-150.<\/p><p>Rand Mcnally And Company. (1910) Washington, D.C. Chicago: Rand, McNally &amp; Co. [Map] Retrieved from the Library of Congress, <a href=\"https://www.loc.gov/item/87691460/\" target=\"_blank\" rel=\"noopener\">https://www.loc.gov/item/87691460/<\/a>.<\/p><p>Seale, W. (2008). <em>The President's House: A History<\/em> (Vol. 2). Johns Hopkins University Press.<\/p><p>Strobl, C. (2008). PostGIS.<\/p><p>Welch, T. F., &amp; Mishra, S. (2013). A measure of equity for public transit connectivity. <em>Journal of Transport Geography<\/em>, <em>33<\/em>, 29-41.<\/p>"}]}, "page_49": {"id": "page_49", "label": "Internships", "blocks": [{"type": "heading", "text": "Avery Durham's GIS Internships"}, {"type": "text", "html": "<p>Through my MSGIS program, I have had four GIS-related internships. The first summer after being accepted to the program, I worked with Salt Lake County Emergency Management and the Utah State Department of Health. A year into the program, I started work at the Utah County Elections Division, which later opened the door to a subsequent internship with the Utah County GIS team on a project plotting septic tanks. <\/p><p>Overviews of the projects completed at each internship are linked below. The Salt Lake County Emergency Management internship is excluded because no project had a nuanced methodology or an interesting deliverable.<\/p>"}, {"type": "text", "html": "<p><strong>LINKS<\/strong><\/p><p><a href=\"https://slcoem.org/\" target=\"_blank\" rel=\"noopener\">Salt Lake County Emergency Management<\/a><\/p><p><a href=\"https://dhhs.utah.gov/\" target=\"_blank\" rel=\"noopener\">Utah State Department of Health<\/a><\/p><p><a href=\"https://www.utahcounty.gov/Dept/clerk/elections/index.html\" target=\"_blank\" rel=\"noopener\">Utah County Elections Division<\/a><\/p><p><a href=\"https://utah-county-gis-maps-and-data-utahcounty.hub.arcgis.com/\" target=\"_blank\" rel=\"noopener\">Utah County GIS<\/a><\/p>"}, {"type": "images", "items": [{"src": "images/widget_7949/1682101742177.JPG", "alt": "", "page": null}]}, {"type": "heading", "text": "GIS INTERNSHIP PROJECTS"}, {"type": "images", "items": [{"src": "images/widget_7880/1680324972577.png", "alt": "", "page": "page_34"}]}, {"type": "heading", "text": "Utah State Department of Health"}, {"type": "text", "html": "<p>At this internship, I worked as the sole GIS professional on a project to assess alcohol outlet density across Utah. This involved cleaning data to a format where it could then be geocoded. Those data points where run through a model that calculated 7 measures of density across 99 statistical areas.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_6550/1680466628706.png", "alt": "", "page": "page_32"}]}, {"type": "heading", "text": "Utah County Elections Division"}, {"type": "text", "html": "<p>This internship was not traditionally a GIS role, but because of my experience, they made provisions for me to fix the voting precinct topology and create a dashboard to visualize where in-person voters chose to cast their ballot.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_6560/1680721162115.PNG", "alt": "", "page": "page_33"}]}, {"type": "heading", "text": "Utah County GIS Team"}, {"type": "text", "html": "<p>The purpose of this internship was to plot septic tank locations throughout Utah county. The project was initiated by the Utah County Health Department, which wanted to improve its ability to track septic tank locations. The project involved linking a database of scanned documents relating to septic tanks and waste water management to points in a features class that could be used in a web application.<\/p>"}]}, "page_34": {"id": "page_34", "label": "Utah State Department of Health Alcohol Outlet Density", "blocks": [{"type": "text", "html": "<p>Utah State Department of Health:<\/p><p>Determining Alcohol Outlet Density<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Timeframe: Summer 2021", "Supervisor: Wei Beadles"]}, {"type": "skills", "items": ["Communication Skills", "Cartography & Graphic Design", "Project Design", "Project Management", "Model Building"]}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p><strong>1.<\/strong><strong>       <\/strong><strong>Define the Purpose<\/strong><\/p><p>This was an exploratory project, and as such it had no specific research hypotheses we were testing. Instead, we wanted to create a dataset that could be used for any number of purposes by anyone that needs it.  \tWe naturally narrowed down the study area to Utah, and divided it into the 99 Utah Department of Health Small Areas. There are some sections of Utah that are not included in these Small Areas, so they are not included in the study. \tThere are two desired outcomes for the project: <\/p><p>\t1)      A spreadsheet full of all the data used in the project. <\/p><p>\t2)      A collection of maps that can be used to visualize the results of the project. <\/p><p><strong>2.<\/strong><strong>       <\/strong><strong>Obtain and Validate Alcohol License Data (And Other Data)<\/strong><\/p><p><strong> <\/strong><\/p><p>Obtaining alcohol license data in Utah is fairly simple. It is available <a href=\"https://abc.utah.gov/licenses-permits/#current-licensees-header\" target=\"_blank\" rel=\"noopener\">here<\/a>. It is available as a PDF and as a spreadsheet. The spreadsheet does not have column headers, so it may be necessary to use both to get all of the information. The licenses have full addresses, which can then be geocoded. \tValidating the license data can be a much more difficult process than obtaining the data. The purpose of validating the data is to ensure that the outlet is still operational, has the prescribed license type, and has the correct address. In general, the site where the license data is available seems to be updated frequently. Even so, some verification should be done in order to assure data quality. In this project, some of that was done during the geocoding process. Any outlets that didn’t geocode properly needed to be put in the correct location manually, and I took this as an opportunity to so check if everything looks correct.  \t<\/p><p>While doing this, I found that ski lodges and other tourist destinations often had multiple alcohol licenses for the same locations. Even though these serve many people from out of state, we wanted to include it because they also serve many Utahns. To deal with the duplicates, we used R to find all outlets with the same full address and went through them one by one to determine if they all should be there. Most duplicates were acceptable, although some were the same license at the same location so one of those needed to be removed. \t <\/p><p><strong>3.<\/strong><strong>       <\/strong><strong>Categorize Alcohol Outlets<\/strong><\/p><p>An important part of this document is the explanation of how the outlets have been categorized. The CDC guide suggests dividing the outlets into ones where the alcohol is consumed at the site (on-premise) and ones where alcohol is consumed away from the site (off-premise). There are 7 categories of outlets that we use for analysis. 4 are basic categories and 3 are combinations of the 4 basic categories. We have bars and restaurants, which also fall into the on-premises category; and we also have state stores and other stores, which fall into the off-premises category. Lastly, we have a category that covers all outlets. \tWe knew several criteria that would help up narrow down the outlets we would want. We weren’t interested in any outlets that: <\/p><p>\t1) Aren’t in a permanently available location (venues, event centers, etc.). <\/p><p>\t2) Don’t cater to primarily Utah populations (hotels, airports, etc.). <\/p><p>\t3) Aren’t available to the general public (private clubs or organizations). <\/p><p>On the page that has the data for all of the alcohol outlets, there is also links that describe the license types. They are already divided into on-premises and off-premises outlets, so from there you have to find which ones of each category goes into bars, restaurants, state stores, and other stores. Bars include all licenses that refer to bars or taverns. Restaurants include other places that serve alcohol on the premises but aren’t classified as a bar. This includes all license types that reference restaurants, as well as BE, which includes recreational locations such as bowling alleys and golf courses whose main function isn’t serving alcohol or food. All state stores have the license type ST. The other off premises stores are OP and PA, which one can tell should easily be included based on the facilities they are attached to. Below is a summary of the outlet categories and counts. ·        <\/p><ul><li>Total On Premises:----------------------------------1741 <\/li><li>Bars:---------------------------------------382 <\/li><li>TV, CL, LB <\/li><li>Restaurants:-----------------------------1359 <\/li><li>BE, RB, RL, LR, RE <\/li><li>Total Off Premises:----------------------------------1760 <\/li><li>State Stores :----------------------------50 <\/li><li>ST                                          <\/li><li>Other Off Premises Stores:---------1710 <\/li><li>OP, PA <\/li><li>Total Outlets:------------------------------------------3501 <\/li><\/ul><p><strong>4.<\/strong><strong>       <\/strong><strong>Geocode Alcohol Outlets<\/strong><\/p><p>All geocoding for this project was done with ArcGIS and by using a locator file found on Utah AGRC’s website. This part of the process takes time but is not especially difficult. Each of the base categories can geocoded as a basic category and then combined to make the combination categories, or all can be geocoded at once and then separated into the basic categories. I chose to geocode the base categories then combine them. As mentioned above, not all outlets geocode properly so those can then be looked at one by one to verify them and put them in the proper place. I found that Yelp.com is useful for finding the outlet addresses. Once they are geocoded, a spatial join is useful to get the count of outlets for each small area.<\/p><p><strong>5.<\/strong><strong>       <\/strong><strong>Calculate Outlet Density<\/strong><\/p><p>Calculating the outlet density is the most time-consuming part of the process. The there are many possible statistics so much more can be done in this area. There are many possible measures of density that can be used, so we chose 7. It is worth being noted however, that two of those are not really measures of density as much measures of area vulnerability.  \tThe measures are divided into count measures and distance measures. Count measures compares the number of outlets to another feature within the Small Area. These include <em>outlets per 10,000 population, outlets per square mile<\/em>, and <em>outlets per 100 miles roadway<\/em>. Distance measures create a mean distance between two features. These include the measures of density (<em>mean distance from outlet to outlet<\/em> and <em>mean distance from neighborhood to outlet<\/em>) as well as the measures of area vulnerability (<em>mean distance from school to outlet<\/em> and <em>mean distance from park to outlet<\/em>). More can be read about these in the CDC guide on which they are based.  \t<\/p>"}, {"type": "text", "html": "<p>The count measures are fairly simple to calculate. Just divide the number of outlets by the appropriate figure. Square miles are easily calculated with the “Calculate Geometry” tool in ArcGIS. Likewise, the population for each small area should be easily found on UDH’s IBIS database. The miles roadway could possibly cause some potential problems. A shapefile with all of Utah’s roadways can be found on Utah AGRC’s website. Once this is load in to ArcGIS, we can use a definition query to find all the roads that are commonly used and should be included in the measure. I did not include roads with the cartographic codes “Other”, “Non-road Feature”, “Driveway”, “Proposed”, “4WD”, “Service Access Road”, or “UDOT FAE”. Once we only have the desired roads, running a spatial join can assign a small area to each road segment, then the “Dissolve” tool can merge together all road segments by the small area designation. The “Dissolve” tool will also calculate the shape length at that point. That value cab then by used to calculate the outlets per 100 miles roadway. \t<\/p><p>The distance measures can be calculated using the “Generate Near Table” tool. The process for those is more complicated, so it is simpler to refer to model that I created in ArcGIS to run all of the measures at once. To run the model, you will need the outlet points, the small area polygons, school points, park points, and populated census block area points. Small area polygons, school points, park polygons, and populated census block area polygons can all be found on Utah AGRC’s website, and the polygons can then be converted to points in ArcGIS. \tAt this point, all of the measures can be done and consolidated into a more concise dataset. A k means test can be conducted on the data in R to find the different data profiles. This is the points that the project is currently at. More analysis is ready to be conducted, including geographically weighted regressions, which can be used to determine whether the different health outcomes (heavy drinking, current alcohol usage, binge drinking, and ED visits) are strongly correlated with alcohol outlet density. The health outcomes data have been prepared, but little has been done with them other than mapping them. They can be found on the IBIS database. We aggregated 5 years of data to make it more reliable, but still make it recent. Another possible direction of the project is to get tax data in order to have a better idea of which outlets sell more alcohol. This can be used to give a weight to each outlet.  <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7885/1680471187752.png", "alt": "", "page": null}, {"src": "images/widget_7880/1680324972577.png", "alt": "", "page": null}, {"src": "images/widget_7881/1680325240787.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 1 &amp; 2) Two examples of maps showing different measures of density for different outlets. The first maps shows the density of bars per 100 miles roadway. The second shows all on premises outlets (restaurants and bars) by average proximity to schools.<\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>Alcohol Licenses: <a href=\"https://abc.utah.gov/licenses-permits/#current-licensees-header\" target=\"_blank\" rel=\"noopener\">https://abc.utah.gov/licenses-permits/#current-licensees-header<\/a><\/p><p>UGRC: <a href=\"https://gis.utah.gov/data/\" target=\"_blank\" rel=\"noopener\">https://gis.utah.gov/data/<\/a><\/p><p>IBIS Database: <a href=\"https://ibis.health.utah.gov/ibisph-view/\" target=\"_blank\" rel=\"noopener\">https://ibis.health.utah.gov/ibisph-view/<\/a><\/p>"}]}, "page_32": {"id": "page_32", "label": "Utah County Elections Division", "blocks": [{"type": "text", "html": "<p>Utah County Elections Division:<\/p><p>Election Assistance Through Topology Repair and a Voting Center Analysis Dashboard<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Timeframe: Spring 2022", "Supervisor: Kristen Swenson"]}, {"type": "skills", "items": ["GIS Analysis", "Spatial Data & Algorithms", "Cartography & Graphic Design", "Communication Skills"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>I worked with the Utah County Elections Division from May 2022 to January 2023, which included a primary and a general election. They hire several people for this position to help with such duties as signature association and verification, and ballot processing. I participated in those activities, however, I was hired specifically because of my experience in GIS. <\/p><p>One of my primary GIS tasks was to fix the topology of the voting precinct feature class. These are features that the system uses to determine which districts and jurisdictions each voter fall under. The topology was in need of repair because it had not been updated since its creation in 2021. I worked with my Elections Division supervisor and a representative with the Utah County GIS team to make sure that it was accurate. It was then sent to UGRC and verified by them as well.<\/p><p>I was also tasked with other GIS tasks including determining the most efficient ballot drop box pickup routes and creating a visualization for where voters who voted at voting centers traveled from within the county. This resulted in the dashboard seen below that was used by Election Division officials and the County Clerk to evaluate the placement of voting centers. Some of the conclusions that this dashboard helped to illustrate were that nearly an equal amount of voters cast their ballot at each voting center, the areas that each voting center draws from are fairly well defined, and that areas with recent move in such as new developments and universities tend towards more in person voting than more established residential areas.<\/p>"}, {"type": "embed", "src": "https://www.arcgis.com/apps/dashboards/4c6e3a6e0c18432a915309b0b87405e8"}]}, "page_33": {"id": "page_33", "label": "Utah County GIS Septic Tanks", "blocks": [{"type": "text", "html": "<p>Utah County GIS Team:<\/p><p>Septic Tank Database Project<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Timeframe: Early 2023", "Supervisor: Darin Sleight"]}, {"type": "skills", "items": ["Spatial Data & Algorithms", "Data Models & Structures", "Database Design", "Project Management"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>This is a project commissioned by the Utah County Health Department to the county GIS team to improve its ability to track septic tank locations. My role has been to plot septic tank locations in ArcGIS Pro and link them to a BMI database. The septic tank dataset was created by geocoding a table  provided by the Utah County Health Department. I went through these points and plotted them when they were unmatched or matched to an incorrect location, plotting them wherever possible to be as representative of the true septic tank location as possible. This was possible because of information  on the document matching information found in the Utah County historic parcel map.<\/p><p>Each point was also linked to a BMI database by using the parcel number as a unique identifier. The BMI database contains a total of about 12,000 septic tank and wastewater documents going back to as early as 1949. Once they are linked, a web application that has been developed can be used to navigate the county and find septic tanks. When the user clicks on the septic tank location it will send them to a page where those documents car available.<\/p><p>This is an ongoing project. I have plotted nearly 2,000 septic tanks with the more than 7,300 plotted and linked to the BMI database through the python code. These locations still need to be verified and have their location adjusted to the septic tank's location on the property. There are also about 2,900 septic tanks that are still unmatched. It is likely that this is because they are from the oldest documents where the addresses may be inaccurate or have changed due to new development. Once the septic tanks are completely plotted, the web application will be available to the Utah County Health Department. It may also be available to the public is the Health Department so decides.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_7899/1682031141006.PNG", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 1) An example of a septic tank application found in the BMI database. Private information has been redacted.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_6560/1680721162115.PNG", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 2) A screenshot of the web application showing a portion of Santaquin, Utah. Red markers indicate septic tanks that have not been linked to the BMI database yet and green markers indicate ones that have been linked.<\/p>"}]}, "page_7": {"id": "page_7", "label": "Resume", "blocks": [{"type": "images", "items": [{"src": "images/widget_917/1678996160236.jpg", "alt": "", "page": null}]}, {"type": "heading", "text": "Education"}, {"type": "images", "items": [{"src": "images/widget_4730/1679593270025.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p><strong>University of Utah<\/strong><\/p><p>\t\tUndergraduate (2015-2016, 2018-2021)<\/p><p>\t\t\t\t\tBachelor's of Science in Geography<\/p><p>\t\t\t\t\tMinor in Global Citizenship<\/p><p>\t\t\t\t\tCertificate in Geographic Information Science<\/p><p>\t\tGraduate (2021-2023)<\/p><p>\t\t\t\t\tMaster's of Science in Geographical Information Science<\/p><p>\t\t\t\tRelevant skills include: Python, R, ArcGIS Pro, ArcGIS Online, SAS, STATA, JAVA, HTML, SQL, ENVI,<\/p><p>\t\t\t\tNetLogo, &amp; Agisoft Metashape<\/p>"}, {"type": "heading", "text": "Resume"}, {"type": "heading", "text": "Septic Tank Intern - Utah County GIS Division"}, {"type": "map", "webmap": "c836c1ac2fd5406bae7c983d732e2ba7"}, {"type": "text", "html": "<p>2023-Current <\/p><p>Working within the Utah County GIS team on a project for the County Health Department.<\/p><p>Involves using a database of wastewater documents to plot septic tank locations so that they<\/p><p>can be visualized in a web map.<\/p><p><strong>Reference:<\/strong><\/p><p>Darin Sleight, GIS Manager<\/p><p>Utah County IT Department<\/p><p>darin@utahcounty.gov<\/p><p>801.851.8432<\/p>"}, {"type": "text", "html": "<p><strong>Elections Specialist - <\/strong>Utah County Elections Division<\/p>"}, {"type": "map", "webmap": "c836c1ac2fd5406bae7c983d732e2ba7"}, {"type": "text", "html": "<p>2022<\/p><p>Has special projects concerning GIS to assist the Elections Division. This includes the topology<\/p><p>fixes and other corrections of precincts and voter data visualization. Assists in voter data entry<\/p><p>and working the ballot center during election season.<\/p><p><strong>Reference:<\/strong><\/p><p>Kris Swenson, Elections Supervisor<\/p><p>Utah County Clerks Office<\/p><p>kristens@utahcounty.gov<\/p><p>801.851.8120<\/p>"}, {"type": "text", "html": "<p><strong>Alcohol GIS Intern - <\/strong>Utah Department of Health<\/p>"}, {"type": "map", "webmap": "7602e284d95d4e2480e8daa0d482b31e"}, {"type": "text", "html": "<p>2021<\/p><p>Conducted GIS analysis to determine the alcohol outlet density of Utah by a variety of different measures and for several outlet types. Worked primarily independently.<\/p><p><strong>Reference:<\/strong><\/p><p>Wei Beadles, Alcohol Epidemiologist<\/p><p>Utah Department of Health, Violence and Injury Prevention Program<\/p><p>whou@utah.gov<\/p><p>385.266.4529<\/p>"}, {"type": "text", "html": "<p><strong>Fire Department Intern - <\/strong>Salt Lake County Emergency Management<\/p>"}, {"type": "map", "webmap": "3aacf482fc234f789485e809ef150c70"}, {"type": "text", "html": "<p>2021<\/p><p>Assisted the GIS specialist with various projects relating to damage control. Included data gathering from other organizations, data editing, and dashboard creation with survey results.<\/p><p><strong>Reference:<\/strong><\/p><p>Sheldon Baumgartner, GIS Specialist<\/p><p>Unified Fire Authority, Salt Lake County Emergency Management<\/p><p>sbaumgartner@unifiedfire.org<\/p><p>801.743.7115<\/p>"}, {"type": "text", "html": "<p><strong>Facility Manager/Crimson Council - <\/strong>U of U Campus Recreation Services<\/p>"}, {"type": "map", "webmap": "21aad8e6952b499cbf955eeb7875da75"}, {"type": "text", "html": "<p>2015-2016, 2018-2021<\/p><p>Student leader position that supervised other student staff and oversaw general building operations at the campus recreation center. Daily tasks included housekeeping and special projects. Filled in any position as needed, including working at the gear rental center and front desk. Crimson council involved conducting hiring interviews, recruitments, trainings, and organizing events for student staff.<\/p><p><strong>Reference:<\/strong><\/p><p>Greg Reinhardt, Student Leadership &amp; Deve
