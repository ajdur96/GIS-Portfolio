<style>
  :root {
    --crimson: #890000;
    --crimsonDark: #5e0000;
    --ink: #1f1f1f;
    --muted: #5c5c5c;
    --line: #e2e2e2;
    --paper: #ffffff;
    --soft: #f6f5f3;
    --radius: 10px;
    --maxWidth: 960px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--paper); line-height: 1.65; font-size: 17px; }
  a { color: var(--crimson); }
  img { max-width: 100%; display: block; }

  /* Header */
  .siteHeader { position: sticky; top: 0; z-index: 20; background: var(--crimson); color: #fff; }
  .headerInner { max-width: var(--maxWidth); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 60px; }
  .brand { color: #fff; text-decoration: none; font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .navList { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
  .navItem { position: relative; }
  .navLink { color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 6px; display: block; font-size: 15px; }
  .navLink:hover, .navLink.active { background: var(--crimsonDark); }
  .subMenu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--line); border-radius: 8px; min-width: 300px; padding: 6px; list-style: none; margin: 0; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .navItem:hover .subMenu, .navItem:focus-within .subMenu { display: block; }
  .subMenu a { display: block; padding: 7px 10px; color: var(--ink); text-decoration: none; border-radius: 5px; font-size: 14px; }
  .subMenu a:hover { background: var(--soft); }
  .menuToggle { display: none; background: none; border: 0; color: #fff; font-size: 26px; cursor: pointer; }

  /* Content */
  main { max-width: var(--maxWidth); margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 6px; }
  .subtitle { font-size: 21px; color: var(--muted); margin: 0 0 18px; font-weight: 500; }
  h2 { font-size: 24px; margin: 40px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--crimson); }
  h3 { font-size: 19px; margin: 28px 0 8px; }
  .byline { color: var(--muted); margin: 0 0 4px; }
  .metaRow { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 15px; margin: 6px 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 24px; padding: 0; list-style: none; }
  .chips li { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; }
  .chipsLabel { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .textBlock p { margin: 0 0 14px; }

  /* Figures */
  .imageGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0; }
  .imageGrid.single { grid-template-columns: 1fr; }
  .imageGrid img { width: 100%; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: var(--soft); }
  .caption { font-size: 14px; color: var(--muted); font-style: italic; margin: -6px 0 18px; }
  .caption p { margin: 0; }
  .frame { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); margin: 18px 0; background: var(--soft); }
  .frame.dashboard { height: 640px; }
  .frame.miniMap { height: 220px; margin: 8px 0 0; }

  /* Cards */
  .cardGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin: 18px 0 30px; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; background: #fff; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.1); }
  .card img { aspect-ratio: 16 / 10; object-fit: cover; width: 100%; }
  .cardBody { padding: 14px 16px 18px; }
  .cardBody h3 { margin: 0 0 6px; color: var(--crimson); }
  .cardBody p { margin: 0 0 8px; font-size: 15px; }
  .cardDate { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* Home */
  .hero { display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: start; margin-bottom: 20px; }
  .hero img { border-radius: var(--radius); }

  /* Resume */
  .job { border-left: 3px solid var(--crimson); padding: 2px 0 2px 16px; margin: 0 0 28px; }
  .job h3 { margin-top: 0; }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-height: 92vh; max-width: 96vw; border-radius: 6px; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 24px; border-top: 1px solid var(--line); }

  @media (max-width: 760px) {
    .menuToggle { display: block; }
    .navList { display: none; position: absolute; top: 60px; left: 0; right: 0; background: var(--crimson); flex-direction: column; padding: 8px 12px 14px; }
    .navList.open { display: flex; }
    .subMenu { display: block; position: static; box-shadow: none; border: 0; background: transparent; padding: 0 0 0 12px; min-width: 0; }
    .subMenu a { color: #ffdede; }
    .subMenu a:hover { background: var(--crimsonDark); }
    .hero { grid-template-columns: 1fr; }
    h1 { font-size: 27px; }
    .frame.dashboard { height: 520px; }
  }
</style>

<script id="siteData" type="application/json">{"nav": [{"id": "page_5", "label": "Homepage", "children": []}, {"id": "page_6", "label": "MSGIS Projects", "children": [{"id": "page_35", "label": "GEOG 6000 - Advanced Geographic Data Analysis"}, {"id": "page_20", "label": "GEOG 6110 - Remote Sensing Analysis"}, {"id": "page_17", "label": "GEOG 6150 - Geospatial Big Data"}, {"id": "page_19", "label": "GEOG 6160 – Spatial Modeling & Geocomputation"}, {"id": "page_38", "label": "GEOG 6161 - Capstone in GIS"}, {"id": "page_21", "label": "GEOG 6165 - Data Visualization"}, {"id": "page_59", "label": "CMP 6720 - Land Use & Transportation Planning"}]}, {"id": "page_49", "label": "Internships", "children": [{"id": "page_34", "label": "Utah State Department of Health Alcohol Outlet Density"}, {"id": "page_32", "label": "Utah County Elections Division"}, {"id": "page_33", "label": "Utah County GIS Septic Tanks"}]}, {"id": "page_7", "label": "Resume", "children": []}], "pages": {"page_5": {"id": "page_5", "label": "Homepage", "blocks": [{"type": "heading", "text": "Avery Durham GIS Portfolio"}, {"type": "images", "items": [{"src": "images/widget_1122/1683577887068.jpg", "alt": "", "page": null}]}, {"type": "text", "html": "<p>I am a graduate student from the University of Utah studying GIS. I’m from Millcreek, Utah but I moved to Chester County, Pennsylvania during high school. I have also lived in Seattle, Washington, and briefly in Washington, DC where I met my wonderful wife. I enjoy reading, hiking, cycling, pickleball, rock climbing, and, of course, GIS.   <\/p><p>Before I knew what GIS was, I completed a GIS-related Eagle Scout Project. I organized volunteers to take pictures of headstones using the Billion Graves app, which would automatically record a GPS marker for each grave so that the exact location in the cemetery would show up when someone searched for that deceased person.  <\/p><p>This is a field that can be applied nearly anywhere. There are seemingly endless applications I want to know more about. I have experience with ArcGIS Pro, Agisoft Metashape, Python, and R but I  am looking for further experience in a professional environment. I have over six years of work experience and about half of that is specifically related to the GIS field. I’ve had GIS internships for the Utah Department of Health, Salt Lake County Emergency Management, Utah County Elections Division, and Utah County GIS Team. I’ve found that a position requiring teamwork and independent work is a good fit for me. Regardless of what my next position contains, I am confident that I will enjoy anything that uses my GIS skills well. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_1126/1679424351013.png", "alt": "", "page": null}]}, {"type": "heading", "text": "2021-2023"}, {"type": "heading", "text": "MSGIS Projects", "link": "page_6"}, {"type": "text", "html": "<p>The MSGIS program at the University of Utah is a professional degree designed to build an understanding of theory and technical skills in statistics, computing, programming, mapping, and GIS methods. <\/p>"}, {"type": "heading", "text": "Internship Projects", "link": "page_49"}, {"type": "heading", "text": "2018-2023"}, {"type": "images", "items": [{"src": "images/widget_6550/1680466628706.png", "alt": "", "page": null}]}, {"type": "heading", "text": "Internship Projects", "link": "page_49"}, {"type": "text", "html": "<p>Over the past 2 years in the MSGIS program, I've had a variety of internships where I have been able to develop and demonstrate my GIS skillset.<\/p>"}, {"type": "heading", "text": "Resume", "link": "page_7"}, {"type": "heading", "text": "2015-Current"}, {"type": "images", "items": [{"src": "images/widget_917/1678996160236.jpg", "alt": "", "page": null}]}, {"type": "heading", "text": "Resume", "link": "page_7"}, {"type": "text", "html": "<p>This page covers my educational and professional qualifications.<\/p>"}]}, "page_6": {"id": "page_6", "label": "MSGIS Projects", "blocks": [{"type": "heading", "text": "Avery Durham's MSGIS Coursework"}, {"type": "text", "html": "<p>The MSGIS program at the University of Utah is a professional degree designed to build an understanding of theory and technical skills in statistics, computing, programming, mapping, and GIS methods. <\/p><p>I chose to pursue a Master's in GIS rather than the Bachelor's in GIS because I wanted to further explore various GIS applications while also developing my professional skills. <\/p>"}, {"type": "text", "html": "<p><strong>LINKS<\/strong><\/p><p><a href=\"https://geog.utah.edu/\" target=\"_blank\" rel=\"noopener\">Geography Department Web Page<\/a><\/p><p><a href=\"https://geog.utah.edu/graduate/msgis.php\" target=\"_blank\" rel=\"noopener\">MSGIS Program Web Page<\/a><\/p><p><a href=\"https://geog.utah.edu/graduate/documents/msgis-handbook.pdf\" target=\"_blank\" rel=\"noopener\">MSGIS Program Handbook<\/a><\/p>"}, {"type": "images", "items": [{"src": "images/widget_7976/1682101897535.jpg", "alt": "", "page": null}]}, {"type": "heading", "text": "MSGIS PROJECTS"}, {"type": "images", "items": [{"src": "images/widget_1126/1679424351013.png", "alt": "", "page": "page_35"}]}, {"type": "heading", "text": "Advanced Geographic Data Analysis"}, {"type": "text", "html": "<p>This course covers complex data analysis methods in the R programming language.<\/p><p>For this project, I used R to analyze the relationship between alcohol outlet density and binge drinking patterns.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_1146/1679424195724.png", "alt": "", "page": "page_20"}]}, {"type": "heading", "text": "Remote Sensing Analysis"}, {"type": "text", "html": "<p>This course covers the technical skills needed for working with high-resolution multispectral data. <\/p><p>For this project, I attempted to use Landsat 8 imagery to determine the land surface temperature of various land covers.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_1136/1679424129440.png", "alt": "", "page": "page_17"}]}, {"type": "heading", "text": "Geospatial Big Data"}, {"type": "text", "html": "<p>This course covers the applications of geospatial big data as well as related topics such as database structure, web GIS, and cloud computing.<\/p><p>For this project, I used web GIS to visualize the complex relationships between the density of different types of alcohol outlets.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_1156/1679423815806.png", "alt": "", "page": "page_19"}]}, {"type": "heading", "text": "Spatial Modeling & Geocomputation"}, {"type": "text", "html": "<p>This course covers machine learning and other techniques that can be used for complex datasets.<\/p><p>For this project, I used NetLogo to model the relationship between commuter train ridership and highway congestion.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_1141/1679423880647.png", "alt": "", "page": "page_21"}]}, {"type": "heading", "text": "Data Visualization"}, {"type": "text", "html": "<p>This course covers the theory and application of visualizing complex geographical and nongeographical data.<\/p><p>For this project, I used a service area analysis to visualize where different types of alcohol outlets were inside or outside the legal proximity to certain buildings and areas.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_1166/1683578222918.png", "alt": "", "page": "page_38"}]}, {"type": "heading", "text": "Capstone in GIS"}, {"type": "text", "html": "<p>This course pairs students with a community partner so that the student can take a project through every stage of work.<\/p><p>For this project, I was paired with the Utah Department of Emergency Management, where I worked to georeference and digitize flood zone maps in rural Utah. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7938/1680985119530.png", "alt": "", "page": "page_59"}]}, {"type": "heading", "text": "Land Use & Transportation Planning"}, {"type": "text", "html": "<p>This course covers how the coordination of a location's transportation planning and land use planning are highly connected.<\/p><p>For this project, I created a SQL database in PostgreSQL to evaluate street connectivity in Washington, DC.<\/p>"}]}, "page_35": {"id": "page_35", "label": "GEOG 6000 - Advanced Geographic Data Analysis", "blocks": [{"type": "text", "html": "<p>GEOG 6000 - Advanced Geographic Data Analysis:<\/p><p>Using Alcohol Outlet Density to Model Drinking Habits<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Fall 2021", "Professor: Simon Brewer"]}, {"type": "skills", "items": ["Spatial Data & Algorithms", "GIS Workflow", "Model Building", "Spatial Analysis", "Basic Programming or Scripting"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>The CDC’s Guide for Measuring Alcohol Outlet Density reports, “Excessive alcohol use is responsible for 88,000 deaths annually in the United States, including 1 in 10 deaths among working-age adults aged 20–64 years” (Centers for Disease Control and Prevention, 2017).  The guide goes on to explain the link between the density of alcohol outlets to excessive drinking. I am familiar with this because from June 2021 to September 2021, I worked in an internship with the Utah Department of Health as a GIS intern tasked with calculating Utah’s alcohol outlet density. The Utah Department of Health divides Utah into 99 small statistical areas with similar populations. There are 5 measures of alcohol outlet density used for each of the small areas. With this data, Utah’s alcohol outlet density is analyzed one step further by performing regression analysis to determine what relationship the various measures of alcohol have in predicting drinking habits. The variables examined are first current alcohol use rate, then binge drinking rate. Some density measures were much more useful in predicting drinking habits, with alcohol outlets per capita being particularly useful.<\/p>"}, {"type": "heading", "text": "Literature Review"}, {"type": "text", "html": "<p>The main source of guidance used in the data creation of this project was the “CDC Guide For Measuring Alcohol Outlet Density” (Centers for Disease Control and Prevention, 2017). This is the definitive guide for state and local health departments to conduct their own alcohol outlet density analysis, which describes three types of measures to determine alcohol outlet density. These are count measures, distance measures, and spatial access-based measures. This analysis uses count measures and distance measures.<\/p><p>Studies consistently link alcohol outlet density to violence and other alcohol related harm (Campbell, et al., 2009; Gorman, et al., 1998; Gruenewald, et al., 2006; Gyimah-Brempong &amp; Racine, 2006; Livingston, 2008; Livingston, et al., 2007; McKinney, et al., 2009; Popova, et al., 2009). One of these studies is “Alcohol outlet density and harm: Comparing the impacts on violence and chronic harms” conducted by Michael Livingston and published in 2011. This study uses 14 years of postal code level data including outlet density, hospital admissions, and economic disadvantages. The purpose of the study was to better understand which types of outlets correlated to which negative outcomes. Livingston divided their outlets into on premises, off premises, and package distributors. Our study of Utah only uses on premises and off premises outlets. They find that on premise whose primary purpose is selling alcohol, what we classify as bars, are related to higher instances of domestic violence, traffic accidents, child abuse, and other injuries. Conversely, a higher density of off premise alcohol outlets is related to higher instances of alcohol related health concerns such as liver disease. Therefore, changing the context of alcohol consumption changes drinking habits, and therefore which dangers are most prevalent. Even though there is a plethora of evidence that alcohol outlet density relates to public health, there is still little evidence of how the relationship truly works. It is notable that this study included no maps. It may have been for privacy reasons since the data is so fine scale, but it would have undoubtably helped in identifying geographic patterns.<\/p>"}, {"type": "heading", "text": "Methodology & Results"}, {"type": "text", "html": "<p>The Utah Department of Health wanted a dataset that could be used for further analysis. The study area was limited to Utah divided into the 99 Utah Department of Health Small Areas. There are some sections of Utah that are not included in these Small Areas, so they are not included in the study.<\/p><p>Alcohol license data is publicly available in Utah (Utah Department of Alcoholic Beverage Control, 2021). The licenses include full addresses, which were then geocoded in ArcGIS Pro. This study only included outlets that, 1) were consistently available. This excluded arenas and event venues. 2) catered primarily to Utah populations. This excluded hotels and airports. 3) were consistently available to the public. This excluded private clubs and organizations. All these exclusions eliminated about 15% of Utah’s alcohol licenses.<\/p><p>The purpose of validating the data is to ensure that the outlet is still operational, has the prescribed license type, and has the correct address. This was done during the geocoding process. Any outlets that didn’t geocode properly needed to be put in the location manually, which was taken as an opportunity to check the address and type of establishment. R was used to find all outlets with the same full address to deal with the duplicates to determine if they should be included. Most duplicates were acceptable because they were for two different establishments that shared the same building, although some were the same license at the same location, so one of those was removed.<\/p><p>The CDC guide suggests dividing the outlets into two categories, locations where the alcohol is consumed at the site (on-premises) and locations where alcohol is taken to be consumed away from the site (off-premises). We use 7 categories of for analysis. 4 are basic categories and 3 are combinations of the 4 basic categories. There are bars and restaurants, which also fall into the on-premises category; and we also have state stores and other stores, which fall into the off-premises category. Lastly, we have a category that covers all outlets.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_4885/1680629696049.png", "alt": "", "page": null}, {"src": "images/widget_4881/1680626816015.png", "alt": "", "page": null}, {"src": "images/widget_4883/1680626718116.png", "alt": "", "page": null}, {"src": "images/widget_4882/1680626672962.png", "alt": "", "page": null}, {"src": "images/widget_4884/1680626778952.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 1-5) These are maps of Utah that show 4 measures alcohol outlet density and 1 composite measure. They are divided into 99 small statistical areas.<\/p>"}, {"type": "text", "html": "<p>Alcohol outlets are predefined as on-premises or off-premises outlets by their license type. Bars include all licenses that refer to bars or taverns. Restaurants include other places that serve alcohol on the premises but aren’t classified as a bar. This includes all license types that specifically reference restaurants, as well as recreational locations such as bowling alleys and golf courses whose main function isn’t serving alcohol or food. All state stores have a license type that designates them as state stores. The other off premises stores license types were determined based on the facilities they are attached to.<\/p><p>There are many possible measures of density that can be used, so we chose 7. It is worth noting however, that 2 of those are not truly measures of density, but rather measures of area vulnerability. These last two were not included in the composite density score.<\/p><p>The measures are divided into count measures and distance measures. Count measures compare the number of outlets to another feature within the Small Area. These include outlets per 10,000 population, outlets per square mile, and outlets per 100 miles roadway. Distance measures create a mean distance between two features. These include the two measures of density which are mean distance from outlet-to-outlet and mean distance from neighborhood-to-outlet. It also included the measures of area vulnerability which are mean distance from school-to-outlet and mean distance from park-to-outlet. <\/p>"}, {"type": "text", "html": "<p>Three health outcomes were considered for a regression analysis, emergency department visits, current alcohol usage rate, and binge drinking rate. Current alcohol usage rate was the first choice because of the hypothesis that it had the highest correlation to alcohol outlet density. Binge drinking rate also likely has a high correlation. However, I supposed that the number of outlets would have a greater affect in increasing accessibility to a wide range of customers rather than increasing accessibility to those few customers that binge drink. Therefore, it is believed that current alcohol drinking rate would have the most prominent correlation. Current alcohol consumption rates were available through the Utah Department of Health IBIS database. <\/p><p>The IBIS database also has demographic data organized by small statistical areas which can be used as confounding factors. These variables should account for race, economic wellbeing, age, and employment rate. The database has limited capabilities, but variables that should be suitable were 1) percentage of Hispanic population, 2) percentage of adult population with an income under $25,000, 3) percentage of the population over 65 years of age, and 4) percentage of adult population that are employed for wages.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_4892/1680629902495.png", "alt": "", "page": null}, {"src": "images/widget_4893/1680629959490.png", "alt": "", "page": null}, {"src": "images/widget_4890/1680629830524.png", "alt": "", "page": null}, {"src": "images/widget_4891/1680629860298.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 6-9) Maps of Utah divided into 99 small statistical areas that show demographic variables used for the model.<\/p>"}, {"type": "text", "html": "<p>Once all the data is created and collected, it can be put into R to be processed. What first needed to be done was to create a simple linear model with all measures of density and demographic variables. It will show which explanatory variables have a significant correlation to current alcohol usage. The results of the model were that all confounding variables were significant as well as alcohol outlets per capita. The model was run again with only these variables, with a resulting adjusted R squared of 0.4612. This R squared shows that our model significantly explains alcohol usage in Utah. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_7892/1683578383024.png", "alt": "", "page": null}, {"src": "images/widget_7890/1680631078506.png", "alt": "", "page": null}, {"src": "images/widget_7891/1680631189441.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig. 10-11) Plots of the residuals. The first shows the residuals without weights and the second show residuals with weights.<\/p>"}, {"type": "text", "html": "<p>A simple linear regression model was improved by adding weights to the current alcohol usage values. This was done by using the inverse of the difference of the upper and lower bounds of the rates. The plot of the weighted model made it more evident how much of an outlier downtown Salt Lake City is compared to the other small areas.<\/p><p>The next step is to run a Moran’s I Monte Carlo analysis. If the result is significant, then a spatial regression model can be used to account for spatial autocorrelation. First, the neighborhood relations must be defined. Since small areas vary so dramatically in area, a distance method was used. With this in place, a Moran’s I is run which found a test statistic of 0.027006. The Monte Carlo rank of this statistic was 941 with a p-value of 0.059. This is not a significant value, but it is close enough that exploring the results of a spatial regression model may still be worthwhile. <\/p><p>A Lagrange multiplier test's return indicate that a spatial error model has a p value of 0.2698 and a spatial lag model has a p value of 1.000. Neither of these values are significant, but a spatial error model is a slightly better fit. The spatial error model that is created has an AIC value of 694.49, while the linear model has an AIC value of 693.7. Since the AIC value is slightly higher in the spatial error model and since there have been no highly significant values, it can be assumed that there is minor spatial autocorrelation in this model.<\/p><p>These steps were repeated but using binge drinking rates rather than current alcohol usage. The resulting adjusted r squared statistic from the weighted model is 0.4397, which is close to the same statistic when using the alcohol outlets per capita variable. A Moran’s I Monte Carlo analysis returns an observed rank of 761 with a p-value of 0.239. This displays even less spatial autocorrelation than with the first variable. These results, unclouded by spatial autocorrelation, clearly show that alcohol outlets per capita is an effective predictor of general drinking habits.<\/p>"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>Alcohol outlets per capita explained drinking habits better than any other measures of density. The other confounding variables are helpful as well, but with more research, perhaps better variables could be found to represent employment, age, ethnicity, economic status, and any other unaccounted significant factor. While the R squared values make it evident that there are still many unaccounted factors to explain drinking habits, they are still surprisingly high. So much so that it may be sensible for policy makers to consider such regulations that would limit the number of alcohol outlets per capita. However, while there is evidence of a correlation, there is not yet evidence of how that relationship works for Utah. It may be that areas with higher alcohol usage attract more alcohol outlets. The situation may also be reversed where the density of alcohol outlets affects drinking habits. There is the economic possibility that higher outlet density drives down alcohol prices and therefore increases availability. There is also a psychological possibility that high outlet density makes higher alcohol usage more socially open and acceptable. There are far more analyses that can be conducted to further explore this data. Perhaps the best place to start would be to do this same analysis but instead of using all outlets at once, separate them out to the on premises and off premises, then bars, restaurants, state stores, and other stores. That could be done to find which kinds of outlets have the biggest affect of drinking habits. Afterward, the same could be done with other health outcomes apart from drinking habits. All of this would give a far more comprehensive vision of what alcohol outlet density means in Utah.<\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>The purpose of this project has been to create models to explore the relationship between alcohol outlet density and drinking habits. After creating this large volume of data with the health department, the meaning needed to be extracted so that the data could be useful. The original problem was that the impact of alcohol outlet density in Utah has been entirely unknown, so the project relied on the available literature on the affect alcohol outlet density in general as a baseline. It is reasonable to assume that alcohol outlet density in Utah affects drinking habits, and this project has better defined that relationship. Outlets per capita is the most affecting measure in predicting usage rate and binge drinking rate without significant spatial autocorrelation. This insight can and should be used as a foundation for further analysis.<\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>Campbell, C. A., Hahn, R. A., Elder, R., Brewer, R., Chattopadhyay, S., Fielding, J., ... &amp; Task Force on Community Preventive Services. (2009). The effectiveness of limiting alcohol outlet density as a means of reducing excessive alcohol consumption and alcohol-related harms. <em>American journal of preventive medicine<\/em>, <em>37<\/em>(6), 556-569.<\/p><p>Centers for Disease Control and Prevention. Guide for Measuring Alcohol Outlet Density. Atlanta, GA: Centers for Disease Control and Prevention, US Dept of Health and Human Services; 2017.<\/p><p>Utah Department of Health. (n.d.). Welcome to ibis-ph; Utah's Public Health Data Resource. Public Health Indicator Based Information System. Retrieved December 13, 2021, from <a href=\"https://ibis.health.utah.gov/ibisph-view/\" target=\"_blank\" rel=\"noopener\">https://ibis.health.utah.gov/ibisph-view/<\/a>. <\/p><p>Gorman, D. M., Speer, P. W., Labouvie, E. W., &amp; Subaiya, A. P. (1998). Risk of assaultive violence and alcohol availability in New Jersey. <em>American journal of public health<\/em>, <em>88<\/em>(1), 97-100.<\/p><p>Gruenewald, P. J., Freisthler, B., Remer, L., LaScala, E. A., &amp; Treno, A. (2006). Ecological models of alcohol outlets and violent assaults: crime potentials and geospatial analysis. <em>Addiction<\/em>, <em>101<\/em>(5), 666-677.<\/p><p>Gyimah-Brempong, K., &amp; Racine, J. (2006). Alcohol availability and crime: a robust approach. <em>Applied Economics<\/em>, <em>38<\/em>(11), 1293-1307.<\/p><p>Livingston, M. (2011). Alcohol outlet density and harm: comparing the impacts on violence and chronic harms. <em>Drug and alcohol review<\/em>, <em>30<\/em>(5), 515-523.<\/p><p>Livingston, M. (2008). Alcohol outlet density and assault: a spatial analysis. <em>Addiction<\/em>, <em>103<\/em>(4), 619-628.<\/p><p>Livingston, M., Chikritzhs, T., &amp; Room, R. (2007). Changing the density of alcohol outlets to reduce alcohol‐related problems. <em>Drug and alcohol review<\/em>, <em>26<\/em>(5), 557-566.<\/p><p>McKinney, C. M., Caetano, R., Harris, T. R., &amp; Ebama, M. S. (2009). Alcohol availability and intimate partner violence among US couples. <em>Alcoholism: Clinical and Experimental Research<\/em>, <em>33<\/em>(1), 169-176.<\/p><p>Popova, S., Giesbrecht, N., Bekmuradov, D., &amp; Patra, J. (2009). Hours and days of sale and density of alcohol outlets: impacts on alcohol consumption and damage: a systematic review. <em>Alcohol &amp; Alcoholism<\/em>, <em>44<\/em>(5), 500-516.<\/p><p>Utah Department of Alcoholic Beverage Control. (2021, December 13). Licenses &amp;amp; permits. Utah's DABC. Retrieved December 13, 2021, from <a href=\"https://abc.utah.gov/licenses-permits/#current-licensees-header\" target=\"_blank\" rel=\"noopener\">https://abc.utah.gov/licenses-permits/#current-licensees-header<\/a>. <\/p><p>Utah Geospatial Resource Center. (n.d.). Data. Utah GIS Portal. Retrieved December 13, 2021, from <a href=\"https://gis.utah.gov/data/\" target=\"_blank\" rel=\"noopener\">https://gis.utah.gov/data/<\/a>.<\/p>"}]}, "page_20": {"id": "page_20", "label": "GEOG 6110 - Remote Sensing Analysis", "blocks": [{"type": "text", "html": "<p>GEOG 6110 - Remote Sensing Analysis:<\/p><p>Differentiating Land Surface Temperature of Land Covers in Sugarhouse, Utah<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Spring 2022", "Professor: Tim Edgar"]}, {"type": "skills", "items": ["GIS Analysis", "Spatial Data & Algorithms", "GIS Workflow", "Project Design", "Project Management", "Communication Skills"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>Highly developed urban areas naturally regulate their temperatures more poorly than less developed areas. This causes urban areas to spend more energy to keep buildings cooler (Akbari, 2002). Excessive heat can also adversely impact public health through effects such as heat stroke (O’Malley &amp; Kikumoto, 2021). Understanding how land covers contribute to higher surface temperatures could help Utah design its urban areas to mitigate excessive heat and reduce these adverse effects. This study investigates the relationship between land cover and land surface temperature in Sugarhouse, Utah. To do so, landcover is classified using bands 1-7 of Landsat 8 data with a maximum likelihood classified. The result was then compared to Landsat 8 land surface temperature data. The summary statistics were used to perform an ANOVA test to determine whether at least one land cover has a significantly different land surface temperature. The expected result is that human-made land covers such as buildings, asphalt, and concrete would have a higher temperature than other land covers such as grass, trees, soil, and water. This study found that this is the case, but poor accuracy in the classification means that the results must be treated with caution.<\/p>"}, {"type": "heading", "text": "Literature Review"}, {"type": "text", "html": "<p>A helpful resource in conducting this study has been a thesis project by Joshua Reynolds at the University of Utah in 2015. The methodology and results could easily be compared to this study. His study was based on the premise that human-made land covers impede an urban area’s ability to regulate its temperature. This plays a part in what is called the urban heat island effect. Vegetation can reduce this by absorbing heat and providing shade. His project aimed to “quantify the relationship between urban vegetation and land surface temperature” (iii). He used a random forest algorithm, a machine learning algorithm, to classify the land cover in Salt Lake Valley. He used NAIP orthoimagery and lidar data to perform this classification. The overall accuracy of the random forest classification was 94%. Next, he compared the classification with the land surface temperature from an ASTER dataset. The percentage of area in the ASTER pixel covered by each land cover was calculated. Then additional statistics were found by using Pearson’s correlation analysis and multiple linear regression. Deciduous tree cover was found to have the strongest correlation with land surface temperature, with irrigated low-stature vegetation having a strong correlation as well. The conclusion was that urban vegetation is important in regulating temperatures in semiarid environments for human comfort (Reynolds, 2017).<\/p>"}, {"type": "heading", "text": "Data & Pre-Processing"}, {"type": "text", "html": "<p>The data used for this study was Landsat 8 data from Earth Explorer. The sensor used to gather the data was OLI TIRS. The date the data was acquired was July 14, 2014. The time of day was around 4:00 pm, which is a moderately good time to tell the difference in the surface temperature because the different materials will have been heating to varying rates since the sunrise due to their different heat coefficients. The air temperature at this time was about 38 degrees Celsius (101 degrees Fahrenheit) (Salt Lake City, UT Weather History, 2014). The row of the data tile is 32, and the path is 38. Bands 1-7 were used in the image classification process. These bands in order are coastal aerosol, blue, green, red, near-infrared, shortwave infrared 1, and shortwave infrared 2. Band 10, the land surface temperature, was used with the land cover masks for summary statistics. The spatial resolution of the data used was 30 meters by 30 meters. Information on the bands is available on the “Landsat 8-9 Operational Land Imager (OLI) - Thermal Infrared Sensor (TIRS) Collection 2 Level 1 (L1) Data Format Control Book (DFCB)” (USGS, 2020). The study area of this project is the Sugarhouse area because it is a familiar area with a variety of land covers in large quantities, including trees, grass, asphalt, water, and buildings.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_2661/1679439942209.png", "alt": "", "page": null}, {"src": "images/widget_2662/1679439972504.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 1 &amp; 2) <\/p>"}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p>Once the data is ready to be analyzed, the first step is to classify the different land covers. A maximum likelihood classification algorithm was selected for this study over a machine learning method because of its high accuracy and low computational requirements (Shivakumar &amp; Rajashekararadhya, 2018). Six land cover classifications were selected. Tree, grass, and water were the three that are expected to have the lowest land surface temperatures. Building, soil, and impervious surfaces are the classifications that are expected to have the highest land surface temperatures. ROIs were created for each land cover type. Impervious surface covers concrete and asphalt, which can’t be differentiated at such course resolution. <\/p><p>To judge the accuracy of the classification, reference ROIs were created for each class. A confusion matrix was created in ENVI. The overall accuracy was second-lowest, 58.9%, with a kappa coefficient of 0.5086. This is very low, and therefore the results must be treated with caution. Upon observing the confusion matrix, there was confusion around the grass classification. The grass had 35.71% producers’ accuracy, the lowest of all classifications. The building class had the second-lowest at 36.36%. Water had the highest at 80%. However, it is clear from the classification image that water was overclassified as it is scattered in places where water is not known to be. This may be due to the effect that shadow has on the pixels. Trees had the lowest user accuracy at 26.32%, and soil had the highest at 92.86%. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2565/1679440112860.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 2) <\/p>"}, {"type": "text", "html": "<p>It is worth noting that a previous version of this study had a classification that had an overall accuracy of 93.6% and a kappa coefficient of 0.9227. This used NAIP and Lidar data with a spatial resolution of 0.5 meters. This classification had to be discarded because the land surface temperatures of the classes were not significantly different. This is expected to happen because of the disparity between the 0.5-meter spatial resolution of the classification and the 30-meter spatial resolution of the Landsat product's land surface temperature.   <\/p><p>Once the classification is created, a mask for each class can be made using the Build Mask tool in ENVI. Running the Compute Band Statistics tool and subsetting by each mask then gives the minimum, maximum, mean, standard deviation, and a histogram of the land surface temperature of each land cover. Using a mask for summary statistics was used in favor of Reynolds’ method of calculating the percentage of land cover per pixel because that method would only function with pixels of different resolution to the land surface temperature raster. In addition, using the masks has the advantages of simplicity and rapidity of calculation. <\/p>"}, {"type": "heading", "text": "Results"}, {"type": "text", "html": "<p>The mean, count, and standard deviation of each class can be used to perform an ANOVA test, which can test the hypothesis of whether at least one of the classes has a significant difference from any other class. The classes going from lowest mean temperature to highest mean temperature were grass, tree, water, impervious surfaces, building, and soil/nonphotosynthetic vegetation. A visual analysis of the statistics shows a gradual rise in temperature in the classes until soil/NVP spikes higher. The three land covers hypothesized to have the lowest surface temperature do indeed have the lowest mean here. Hence, the land covers hypothesized to have the hottest land surface temperature are the hottest. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2600/1679440264390.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 3) <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2670/1679445577376.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>1: Grass<\/p><p>2: Tree<\/p><p>3: Water<\/p><p>4: Impervious surfaces<\/p><p>5: Building<\/p><p>6: Soil/NPV<\/p>"}, {"type": "caption", "html": "<p>Fig 4) <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2603/1679446076692.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 5) <\/p>"}, {"type": "text", "html": "<p>An ANOVA test is a valid method for assessing whether there is a significant difference between land surface temperatures for different areas in Landsat 8 images (Connors et al., 2013). For the ANOVA test, the null hypothesis is that there is no significant difference, and the alternative hypothesis is that at least one group differed from the others. The between-group and within-group sum of squares can be seen in figure 6. The observed F value is 434.636, which is highly significant. Since the P-value is low, we reject the null hypothesis and accept the alternative. There is a statistically significant difference in land surface temperature between the land cover classes. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2590/1679446595365.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 6) <\/p>"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>The primary limitation of this study is the low overall accuracy and kappa coefficient of the maximum likelihood classification. Lidar seemed to improve the first classification done and Josh Reynold’s thesis, so it is possible that future research could include a classification that takes Lidar into account. Since that was not done in this study, the results must be treated with caution. Another limitation is that, at a 30-meter resolution, concrete could not be differentiated from asphalt. The effect of this is relatively small, however, since they are both human-made land covers and were both hypothesized to have higher land surface temperatures.  <\/p><p>A note of interest that may or may not have contributed to the results is the anomalous cold spots present in the land surface temperature image. There are no clouds or cloud shadows in any other bands, so it is unclear what these are. It can be trusted that they accurately represent the ground surface temperature, but having strange cold spots is not an ideal analysis condition. A future study should either discover the nature of these spots or find an image in which they can be discounted. <\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>The objective of this study has been to use remotely sensed data to explore if human-made land covers have a statistically significant higher land surface temperature. Understanding this relationship more deeply could help build cities that will naturally regulate temperatures better and improve public health. According to the ANOVA test, land cover is a statistically significant predictor of land surface temperature. However, with the overall accuracy of the classification at 58.9%, the study must be called into question. Perhaps a future iteration of this study will be able to reconcile higher resolution NAIP and lidar data with the courser Landsat 8 land surface temperature data product. Based on other results of other studies such as that conducted by Reynolds, strong results are possible with different methods and perhaps more carefully selected data.<\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>Akbari, H. (2002). Shade trees reduce building energy use and CO2 emissions from power plants. <em>Environmental pollution<\/em>, <em>116<\/em>, S119-S126.<\/p><p>O’Malley, C., &amp; Kikumoto, H. (2021). An investigation into the relationship between remotely sensed land surface temperatures and heat stroke incident rates in the Tokyo Prefecture 2010–2019. <em>Sustainable Cities and Society<\/em>, <em>71<\/em>, 102988.<\/p><p>Reynolds, J. D. (2017). <em>Comparing Urban Vegetation Cover with Summer Land Surface Temperature in the Salt Lake Valley<\/em> (Doctoral dissertation, The University of Utah).<\/p><p><em>Salt Lake City, UT Weather History<\/em>. Weather Underground. (2014, July 14). Retrieved May 2, 2022, from <a href=\"https://www.wunderground.com/history/daily/us/ut/salt-lake-city/KSLC/date/2014-7-14\" target=\"_blank\" rel=\"noopener\">https://www.wunderground.com/history/daily/us/ut/salt-lake-city/KSLC/date/2014-7-14<\/a><\/p><p>Shivakumar, B. R., &amp; Rajashekararadhya, S. V. (2018). Investigation on land cover mapping capability of maximum likelihood classifier: a case study on North Canara, India. <em>Procedia computer science<\/em>, <em>143<\/em>, 579-586.<\/p><p>USGS, &amp; Engebretson, C., Landsat 8-9 Operational Land Imager (OLI) - Thermal Infrared Sensor (TIRS) Collection 2 Level 1 (L1) Data Format Control Book (DFCB)3–56 (2020). Sioux Falls, South Dakota.  <\/p>"}]}, "page_17": {"id": "page_17", "label": "GEOG 6150 - Geospatial Big Data", "blocks": [{"type": "text", "html": "<p>GEOG 6150 - Geospatial Big Data:<\/p><p>Visualizing and Comparing Alcohol Outlet Density<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Fall 2021", "Professor: Alexander Hohl"]}, {"type": "skills", "items": ["GIS Workflow", "Model Building", "Cartography & Graphic Design", "Spatial Analysis", "Communication Skills"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>Those that live in Utah are aware of the state’s strange relationship with alcohol. Much of this cultural dissonance with alcohol is under the banner of protecting public health. Alcohol outlet density matters because, as is demonstrated below, it is well established that it is a contributing factor to such public health concerns as violence, injury, and illness. In the summer of 2021, the direction of the Utah Department of Health conducted a review of the alcohol outlet density within the state. Density was measured for 7 categories of outlets, under 5 different measures of density, and across the 99 small statistical areas of Utah. This produced an abundance of raw data that could not be easily visualized or compared. A visualization of the data is necessary because the amount of the data is too large to be understood by itself. The purpose of this project was to simplify the data and present it in a dashboard so that the density of the different types of outlets can be more easily compared. The final dashboard is clear and concise, so later it may be expanded to include comparisons of other variables such as health outcomes.<\/p>"}, {"type": "heading", "text": "Literature Review"}, {"type": "text", "html": "<p>The main source of guidance used in the data creation of this project was the “CDC Guide For Measuring Alcohol Outlet Density” (Centers for Disease Control and Prevention, 2017). This is the definitive guide for state and local health departments to conduct their own alcohol outlet density analysis. It describes the public health and economic concerns that are affected by high alcohol outlet density. Excessive alcohol consumption is responsible for 88,000 deaths annually and cost the economy $249 billion in 2010. The guide defines 6 steps to measure alcohol outlet density. They are 1) build a measurement team, 2) define the purpose, 3) obtain and validate alcohol license data, 4) categorize alcohol outlets, 5) geocode alcohol outlets, and 6) calculate alcohol outlet density. This guide suggests that outlets are divided into on-premise and off-premise outlets, which was implemented in this analysis. It also describes three types of measures to determine alcohol outlet density. These are count measures, distance measures, and spatial access-based measures. This analysis uses count measures and distance measures. Spatial access-based measures are the most complicated and computationally heavy, and not needed for an exploratory project.<\/p><p>Studies consistently link alcohol outlet density to violence and other alcohol related harm (Campbell, et al., 2009; Gorman, et al., 1998; Gruenewald, et al., 2006; Gyimah-Brempong &amp; Racine, 2006; Livingston, 2008; Livingston, et al., 2007; McKinney, et al., 2009; Popova, et al., 2009). One of these studies is “Alcohol outlet density and harm: Comparing the impacts on violence and chronic harms” conducted by Michael Livingston and published in 2011. This study uses 14 years of postal code level data including outlet density, hospital admissions, and economic disadvantages. The purpose of the study was to better understand which types of outlets correlated to which negative outcomes. Livingston divided their outlets into on premises, off premises, and package distributors. Our study of Utah only uses on premises and off premises outlets. They find that on premise whose primary purpose is selling alcohol, what we classify as bars, are related to higher instances of domestic violence, traffic accidents, child abuse, and other injuries. Conversely, a higher density of off premise alcohol outlets is related to higher instances of alcohol related health concerns such as liver disease. Therefore, changing the context of alcohol consumption changes drinking habits, and therefore which dangers are most prevalent. Even though there is a plethora of evidence that alcohol outlet density relates to public health, there is still little evidence of how the relationship truly works. It is notable that this study included no maps. It may have been for privacy reasons since the data is so fine scale, but it would have undoubtably helped in identifying geographic patterns.<\/p><p>As this project involves creating a dashboard to visualize the data, it is fitting to review the purpose and use of dashboards. Pauwels et al. cover the subject in detail in their 2004 article “Dashboards as a Service: Why, What, How, and What Research Is Needed?”. They explain that in our current information age, there is an excess of useful information, but there is a problem in communicating that information effectively. Dashboards are a useful method for turning raw information into “actionable insights” (176). They focus on dashboards that measure performance within an organization and define them as a small collection of metrics. They name poor organization of data needed for decision making as one of the driving needs for a dashboard, which is also the most relevant need in making the alcohol outlet density dashboard. A single interface can integrate and summarize the most relevant data while leaving irrelevant data out. However, they note that many dashboards poorly integrate data. They name several strengths of dashboards. The first strength is that they create a format that will remain consistent even as data changes. Second is that it is a visual monitor. Third is that they can be used for decision making and planning. Fourth, they can easily communicate information. The authors finish with their wish that the usefulness of dashboards will be recognized so that there will be further research about how to use them effectively.<\/p>"}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p>This was an exploratory project, and as such it had no specific research hypotheses to test. Instead, the Utah Department of Health wanted a dataset that could be used as a resource to the public and for further analysis. The study area was limited to Utah divided into the 99 Utah Department of Health Small Areas. There are some sections of Utah that are not included in these Small Areas, so they are not included in the study.<\/p><p>The first step was to obtain the alcohol license data. Obtaining alcohol license data in Utah is publicly available (Utah Department of Alcoholic Beverage Control, 2021). The licenses have full addresses, which were then be geocoded in ArcGIS. Before geocoding, the outlets that were to be used in the analysis were selected using certain criteria. First, there were to only be outlets that were consistently available. This excluded arenas and event venues. Second, there were only to be outlets that catered primarily to Utah populations. This excluded hotels and airports. Third, only outlets that are available to the general public. This excluded private clubs and organizations. This eliminated about 15% of Utah’s alcohol licenses.<\/p><p>Validating the license data is a more drawn-out process than obtaining the data. The purpose of validating the data is to ensure that the outlet is still operational, has the prescribed license type, and has the correct address. In general, the site where the license data is available seems to be updated frequently. Even so, some verification should be done to assure data quality. In this project, some of that was done during the geocoding process. Any outlets that didn’t geocode properly needed to be put in the correct location manually, which was taken as an opportunity to so check the address and type of establishment.<\/p><p>During this part of the project, ski lodges and other tourist destinations were found to often have multiple alcohol licenses for the same locations. Even though these serve many people from out of state, they were included because they also serve many Utahns. To deal with the duplicates, an associate of the Utah Department of Health used R to find all outlets with the same full address and went through them one by one to determine if they all should be included. Most duplicates were acceptable because they were for two different establishments that shared the same building, although some were the same license at the same location so one of those needed to be removed.<\/p><p>After determining which outlets were included, the outlets were categorized. The CDC guide suggests dividing the outlets into ones where the alcohol is consumed at the site (on-premise) and ones where alcohol is taken to be consumed away from the site (off-premise). There are 7 categories of outlets that we use for analysis. 4 are basic categories and 3 are combinations of the 4 basic categories. There are bars and restaurants, which also fall into the on-premises category; and we also have state stores and other stores, which fall into the off-premises category. Lastly, we have a category that covers all outlets.<\/p><p>On the same organization webpage that contained the data for alcohol licenses, there is also descriptions of each license type. They are predefined as on-premises or off-premises outlets, so from there it was up to the discretion of the Utah Department of Health to categorize each license into bars, restaurants, state stores, and other stores. Bars include all licenses that refer to bars or taverns. Restaurants include other places that serve alcohol on the premises but aren’t classified as a bar. This includes all license types that specifically reference restaurants, as well as recreational locations such as bowling alleys and golf courses whose main function isn’t serving alcohol or food. All state stores have a license type that designates them as state stores. The other off premises stores license types were determined based on the facilities they are attached to.<\/p><p>All geocoding for this project was done with ArcGIS and by using a locator file found on Utah AGRC’s website (Utah Geospatial Resource Center). All parts of this project were stored in a geodatabase that was created for that purpose. Each of the base categories were geocoded as a basic category and then combined to make the combination categories. Once they are geocoded, a spatial join is useful to get the count of outlets for each small area.<\/p><p>Calculating the outlet density is the most time-consuming part of the process. The there are many possible statistics so much more can be done in this area. There are many possible measures of density that can be used, so we chose 7. It is worth being noted however, that 2 of those are not truly measures of density but rather measures of area vulnerability. These last two were not included in the composite density score.<\/p><p>The measures are divided into count measures and distance measures. Count measures compares the number of outlets to another feature within the Small Area. These include outlets per 10,000 population, outlets per square mile, and outlets per 100 miles roadway. Distance measures create a mean distance between two features. These include the two measures of density which are mean distance from outlet-to-outlet and mean distance from neighborhood-to-outlet. It also included the measures of area vulnerability which are mean distance from school-to-outlet and mean distance from park-to-outlet. <\/p><p>The count measures are simple calculations of dividing the number of outlets by the appropriate figure. Square miles were calculated with the “Calculate Geometry” tool in ArcGIS. Likewise, the population for each small area were found on the Utah Department of Health’s IBIS database (Utah Department of Health). The outlets per 100 miles roadway was more complicated to calculate than the others and less precise. A shapefile with all of Utah’s roadways were found on Utah AGRC’s website. Once this is loaded into ArcGIS, a definition query will find all the roads that are commonly used and should be included in the measure. Roads that were not desirable included features with the cartographic codes “Other”, “Non-road Feature”, “Driveway”, “Proposed”, “4WD”, “Service Access Road”, or “UDOT FAE”. Once there were only the desired roads, running a spatial join assigned a small area to each road segment, then the “Dissolve” tool merged together all road segments by the small area designation. The “Dissolve” tool will also calculate the shape length at that point. That value can then be used to calculate the outlets per 100 miles roadway. While the roads in the resulting feature are not completely confined to within their respective small area, the calculation is a close approximation. <\/p><p>The process for calculating the distance measures was more complicated, so a model was created in Model Builder in ArcGIS to run all of the measures at once. It implemented the “Generate Near Table” tool. To run, the model needed the outlet points, the small area polygons, school points, park points, and populated census block area centroids. Small area polygons, school points, park polygons, and populated census block area polygons were all be found on Utah AGRC’s website, and the polygons can then be converted to points in ArcGIS. For all distance measures, only the single nearest outlet was used. <\/p><p>After the data was created, it is not helpful until we know what we can do with it. There are many statistical analyses that can be performed, but this project limits itself to visualizing the data to be able to compare the densities of different outlet types. Once there is a clear visualization, the necessarily analyses may become more evident. Visualization would be well accomplished with a dashboard because they have the capacity to present a large amount of data concisely. R and ArcGIS Online are both methods that could fulfill the needs of the project, so ArcGIS Online was chosen over R because of the ease and speed with which a dashboard could be created. The initial dashboard concept was for two side-by-side maps where each map could have a different outlet type displayed. For the sake of simplicity, a single map is used for the final dashboard. In the final dashboard, only a single map was needed because ArcGIS Online is able to symbolize layers in a way to easily compare two attributes. The other features on the dashboard are a legend, a list of all small areas, and a graph. The list of small areas is used for ease of navigating to small areas that have an unknown location. The graph is useful for seeing which small areas have a higher or lower density than others.<\/p>"}, {"type": "heading", "text": "Results"}, {"type": "text", "html": "<p>The dashboard displays the results concisely. With the density of the types of outlets now easily comparable, several things are evident that were not before. By using single variables maps beforehand, it was easy to see clusters of the highest and lowest values for each outlet type. Salt Lake County had consistently high values, with downtown Salt Lake City being an extreme outlier. Grand County and Washington County also had notably high rates. The rest of Utah, most of which is rural, tended to have significantly low outlet densities.<\/p><p>The dashboard could then be used to further explore the relationship between outlet types. We learn alcohol outlet density is far from uniform across the different outlet types. The only small areas that have the highest values for both on premises and off premises outlets are Salt Lake County along I-15, Park City, Grand County, and downtown Ogden. Even though restaurants and other stores make up the majority of outlets used in those measures, the map displaying the relationship of those two outlet types looks significantly different than the on premises and off premises map. This means that even though bars and state stores are few in number, they make a significant difference in the overall distribution of alcohol outlet density. Looking deeper, we find that the only two areas that are high in both restaurants and bars are Carbon County and Tooele Valley, which are rural areas that don’t have the highest readings in any category. Conversely, the map of the relationship between state stores and other stores shows that nearly all the Salt Lake valley has a high density of both outlet types. Observations like this help to better understand the relationships between outlet types.<\/p>"}, {"type": "embed", "src": "https://www.arcgis.com/apps/dashboards/87575a11740140fd8ca40a19466388e5"}, {"type": "heading", "text": "Discussion"}, {"type": "text", "html": "<p>This project could and should be continued past the scope of what has been done here. Visualization is the first step in knowing the right questions to ask. More visualization could be done to compare density measure types, or the project could move onto more thorough statistical analysis. What can be done now is to create spatial regression models using this data and other data found in the IBIS database to predict health outcomes such as current alcohol usage, binge drinking rate, or other health outcomes. Now that the alcohol outlet density review has been conducted once, it could be repeated regularly to determine how alcohol outlet density and its relationship to health is changing throughout the years. The primary limitations of this project have been that it only covers a single year of data, and that it is unclear how best to apply this data next. Continuing the project would accommodate for these limitations. <\/p><p>This is an analysis that would easily lend itself to parallel computing. The seven different measures as well as the the seven different outlet types could be done simultaneously, making 49 tasks. The large number of parallel tasks would greatly accelerate processing time. There are still some tasks that must be done sequentially at the beginning or end of the process, but the majority of the computing time would be accomplished far more rapidly. <\/p><p>This project could also potentially be expanded to a larger scale, perhaps even to the level of big data. The four Vs which qualify data as big data are volume, velocity, veracity, and variety. Volume could be expanded by conducting a nationwide review of alcohol outlet density. The containers would likely be counties rather than small statistical areas in order to keep it consistent across the country. Velocity could be increased by updating the statistics regularly. Alcohol outlet density does not change quickly, but this could potentially be conducted monthly to find any annual trends. Veracity would become more difficult as the scale grew larger because alcohol license data or GIS data like shapefiles may not be as accessible across the country as they are in Utah. Variety could be expanded by including demographic or geographic factors. Altogether, a project of this scale would be more than a household processor could handle.<\/p>"}, {"type": "heading", "text": "Conclusion"}, {"type": "text", "html": "<p>The purpose of this project has been to take the data on alcohol outlet density measures and visualize them in a way that the different types of outlets could easily be compared. The data came from geocoded alcohol license data and was conducted under the direction of the Utah Department of Health. The initial analyses produced a large amount of data that are difficult to interpret as raw data, so maps were used. It is important to interpret them because alcohol outlet density is significantly correlated with health concerns like violence and liver disease. A dashboard with ArcGIS Online can easily be created to integrate the data together. Being able to see the data provides insights about how to proceed, for instance perhaps how urban and rural Utah might be treated differently because of the different densities. Visualization is only the beginning, so further analysis can be done to determine how the density of different alcohol outlets are correlated with various health concerns.<\/p>"}, {"type": "heading", "text": "References"}, {"type": "text", "html": "<p>Campbell, C. A., Hahn, R. A., Elder, R., Brewer, R., Chattopadhyay, S., Fielding, J., ... &amp; Task Force on Community Preventive Services. (2009). The effectiveness of limiting alcohol outlet density as a means of reducing excessive alcohol consumption and alcohol-related harms. <em>American journal of preventive medicine<\/em>, <em>37<\/em>(6), 556-569.<\/p><p>Centers for Disease Control and Prevention. Guide for Measuring Alcohol Outlet Density. Atlanta, GA: Centers for Disease Control and Prevention, US Dept of Health and Human Services; 2017.<\/p><p>Utah Department of Health. (n.d.). Welcome to ibis-ph; Utah's Public Health Data Resource. Public Health Indicator Based Information System. Retrieved December 13, 2021, from <a href=\"https://ibis.health.utah.gov/ibisph-view/\" target=\"_blank\" rel=\"noopener\">https://ibis.health.utah.gov/ibisph-view/<\/a>. <\/p><p>Gorman, D. M., Speer, P. W., Labouvie, E. W., &amp; Subaiya, A. P. (1998). Risk of assaultive violence and alcohol availability in New Jersey. <em>American journal of public health<\/em>, <em>88<\/em>(1), 97-100.<\/p><p>Gruenewald, P. J., Freisthler, B., Remer, L., LaScala, E. A., &amp; Treno, A. (2006). Ecological models of alcohol outlets and violent assaults: crime potentials and geospatial analysis. <em>Addiction<\/em>, <em>101<\/em>(5), 666-677.<\/p><p>Gyimah-Brempong, K., &amp; Racine, J. (2006). Alcohol availability and crime: a robust approach. <em>Applied Economics<\/em>, <em>38<\/em>(11), 1293-1307.<\/p><p>Livingston, M. (2011). Alcohol outlet density and harm: comparing the impacts on violence and chronic harms. <em>Drug and alcohol review<\/em>, <em>30<\/em>(5), 515-523.<\/p><p>Livingston, M. (2008). Alcohol outlet density and assault: a spatial analysis. <em>Addiction<\/em>, <em>103<\/em>(4), 619-628.<\/p><p>Livingston, M., Chikritzhs, T., &amp; Room, R. (2007). Changing the density of alcohol outlets to reduce alcohol‐related problems. <em>Drug and alcohol review<\/em>, <em>26<\/em>(5), 557-566.<\/p><p>McKinney, C. M., Caetano, R., Harris, T. R., &amp; Ebama, M. S. (2009). Alcohol availability and intimate partner violence among US couples. <em>Alcoholism: Clinical and Experimental Research<\/em>, <em>33<\/em>(1), 169-176.<\/p><p>Pauwels, K., Ambler, T., Clark, B. H., LaPointe, P., Reibstein, D., Skiera, B., Wierenga, B., &amp; Wiesel, T. (2009). <a href=\"\" target=\"_blank\" rel=\"noopener\">Dashboards as a Service: Why, What, How, and What Research Is Needed? <\/a><em>Journal of Service Research<\/em>, <em>12<\/em>(2), 175–189. <a href=\"https://doi.org/10.1177/1094670509344213\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1177/1094670509344213<\/a><\/p><p>Popova, S., Giesbrecht, N., Bekmuradov, D., &amp; Patra, J. (2009). Hours and days of sale and density of alcohol outlets: impacts on alcohol consumption and damage: a systematic review. <em>Alcohol &amp; Alcoholism<\/em>, <em>44<\/em>(5), 500-516.<\/p><p>Utah Department of Alcoholic Beverage Control. (2021, December 13). Licenses &amp;amp; permits. Utah's DABC. Retrieved December 13, 2021, from <a href=\"https://abc.utah.gov/licenses-permits/#current-licensees-header\" target=\"_blank\" rel=\"noopener\">https://abc.utah.gov/licenses-permits/#current-licensees-header<\/a>. <\/p><p>Utah Geospatial Resource Center. (n.d.). Data. Utah GIS Portal. Retrieved December 13, 2021, from <a href=\"https://gis.utah.gov/data/\" target=\"_blank\" rel=\"noopener\">https://gis.utah.gov/data/<\/a>.<\/p>"}]}, "page_19": {"id": "page_19", "label": "GEOG 6160 – Spatial Modeling & Geocomputation", "blocks": [{"type": "text", "html": "<p>GEOG 6160 - Spatial Modeling &amp; Geocomputation:<\/p><p>Modeling Frontrunner Ridership between Salt Lake City and Lehi<\/p>"}, {"type": "heading", "text": "Avery Durham"}, {"type": "meta", "items": ["Semester: Spring 2022", "Professor: Simon Brewer"]}, {"type": "skills", "items": ["Spatial Data & Algorithms", "Data Models & Structures", "Project Design", "Project Management", "Programming & Scripting"]}, {"type": "heading", "text": "Introduction"}, {"type": "text", "html": "<p>Any Utahn that drives past the point of the mountain during rush hour soon becomes aware that traffic is a significant problem between Salt Lake City and Lehi. One solution to reduce congestion is for commuters to take the Frontrunner train. The complication is that once fewer people drive their personal vehicles and traffic moves faster, more people will again be drawn from the Frontrunner to their personal vehicles by the shorter commute time. This project aims to find combinations of variables that would consistently lead to faster commute times through higher Frontrunner usage. This is done through a model created in NetLogo with seven adjustable variables.<\/p>"}, {"type": "heading", "text": "Literature Review"}, {"type": "text", "html": "<p>Senate District 13, which includes Lehi, is Utah’s fastest-growing senate district (Webb, 2021). In January of 2021, the state senator over that district, Jacob Anderegg, gave an interview where he claimed that transportation infrastructure in that area isn’t developing fast enough to avoid “transportation gridlock” (Webb 2021). To prepare for Utah valley’s population to potentially double in the next 30 years, he proposes an expansion of the Frontrunner. One option for funding the development would be a gas tax, discouraging drivers, and encouraging public transit.<\/p><p>Taylor and Fink divide influencing factors into internal and external factors (2009; Taylor et al., 2003). External factors include the socioeconomic status of the population, geography of the region, and financing. The internal factors include fare prices, service quantity, and service quality. Service quantity consists of the diversity of services, area coverage, and frequency of stops. Service quality has to do with the passengers feeling safe, available information, and consistent services. Since external factors are generally outside of control, this study will primarily focus on internal factors and include the total population as an external factor. However, since service quality is not easily quantified, only fare prices and service quality will be considered.  <\/p><p>A document that provides an in-depth snapshot of commuting in Utah is the Kem C. Gardener Policy Institute document <em>Moving Toward 2020: Utah Commuting Patterns 2000 to 2010.<\/em> They found that Utah’s average commute time was 21 minutes, below the national travel time of 25.5 minutes. They calculated that walking, bicycling, or public transit comprised about 6% of commuting, while personal vehicles and carpools included the rest. Concerning Utah and Salt Lake counties, they found that the two counties had a commuter flow of about 40,000 (Bateman &amp; Young, 2010). Nearly all these likely use I-15, which is the main stretch of road that this study is examining. <\/p>"}, {"type": "heading", "text": "Methodology"}, {"type": "text", "html": "<p>The model has seven variables that the user can edit:<\/p><p>1) the cost of daily travel by car<\/p><p>2) the cost of daily travel by train<\/p><p>3) the interval at which trains come to pick up passengers<\/p><p>4) the total number of commuters<\/p><p>5) the weight given to travel time vs. monetary cost<\/p><p>6) noise which makes the model less stable<\/p><p>7) the number of days (iterations) that the model simulates<\/p><p>The model is meant to consider the travel time and monetary cost of each method of travel. For the travel time, the Frontrunner takes 35 minutes to travel between the Lehi station and the Salt Lake Central station (Utah Transit Authority). The interval the train comes is then divided by two to create the average wait time and added to those 35 minutes to generate the Frontrunner’s travel time value. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2464/1679436625160.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>The travel between Salt Lake City and Lehi by personal vehicle is about 25 miles, which can be traversed in about 20 minutes by driving 100 miles per hour. This is the free flow speed when there are no other vehicles on the road and no traffic laws. 20 minutes is taken as the minimum, just as 35 minutes was used for the T-time calculation. The minimum is added to the number of drivers squared multiplied by 0.0000000005. This is a constant that was achieved after experimentation with the model. After the default values were determined, this factor was input to make the mean users of public transit about 6% of the total. The drivers variable is taken from the previous iteration.<\/p>"}, {"type": "images", "items": [{"src": "images/widget_2468/1679436661842.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>The monetary cost is not calculated but is given as a variable by the user. The T-cost variable represents the cost in dollars for one full day of Frontrunner fare. The C-cost variable does not represent the gas price per gallon, but the expenditure spent on gas for a whole day of commuting. <\/p><p>The monetary costs and two travel times for each mode of travel can then be combined to create a number to represent their general favorability. These are called the C-factor (car factor) and T-factor (train factor). To experiment with what would happen if travel time or monetary cost were differently weighted, a variable called Time-Weight is included. Time-Weight is a number between 0 and 1 multiplied by the travel times. 1 – Time-Weight is multiplied by the monetary costs. This allows the user to determine how each is weighted. If the Time-Weight is set to 0, commuters will only make decisions based on the monetary cost. On the other hand, if it is set to 1, they will only make decisions based on travel time. The monetary cost is also multiplied by 4. Otherwise, travel time would always be heavier because there are more minutes in travel time than dollars in the daily cost. This constant ensures that travel time and monetary cost are of the same magnitude.  <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2472/1679436711710.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>The threshold is a ratio between the T-factor and C-factor. The smaller each is, the more likely the random number generated for each commuter will be to that mode of transportation. If the random number is greater than the threshold, they drive, but if it is lower, they take the train. There is also a variable X that multiplies a random number to add noise as the user chooses.   <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2476/1683578503423.png", "alt": "", "page": null}]}, {"type": "caption", "html": "<p>Fig 1) A DESMOS curve with all the variables at their default value. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2493/1679436826979.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>These equations were first planned in DESMOS, an online graphing calculator. Adjusting the C-cost, T-cost, Interval, and Time-Weight all changed the shape of the curve. The curve on the positive side of 0 represents the possible values of the threshold under those conditions. The Y-axis represents the threshold, and the X-axis represents the number of drivers on the previous day. The area above the curve represents the chance of taking a personal vehicle, while the area below can be thought of as taking public transit. Under the default conditions, the y-intercept is 25. <\/p>"}, {"type": "images", "items": [{"src": "images/widget_2482/1679436883521.png", "alt": "", "page": null}]}, {"type": "text", "html": "<p>Default values were chosen for each variable meant to represent the current conditions. The Frontrunner Interval time and monetary cost of $5 for a day of commuting by Frontrunner are taken from the UDOT website (Utah Transit Authority). The driving price of $4.25 is taken from calculating the estimated cost of driving th
