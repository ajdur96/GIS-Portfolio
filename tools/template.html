<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avery Durham GIS Portfolio</title>
<meta name="description" content="GIS portfolio of Avery Durham: graduate projects, internships, and resume.">
<style>
  :root {
    --crimson: #890000;
    --crimsonDark: #5e0000;
    --ink: #1f1f1f;
    --muted: #5c5c5c;
    --line: #e2e2e2;
    --paper: #ffffff;
    --soft: #f6f5f3;
    --radius: 10px;
    --maxWidth: 960px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--paper); line-height: 1.65; font-size: 17px; }
  a { color: var(--crimson); }
  img { max-width: 100%; display: block; }

  /* Header */
  .siteHeader { position: sticky; top: 0; z-index: 20; background: var(--crimson); color: #fff; }
  .headerInner { max-width: var(--maxWidth); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 60px; }
  .brand { color: #fff; text-decoration: none; font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .navList { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
  .navItem { position: relative; }
  .navLink { color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 6px; display: block; font-size: 15px; }
  .navLink:hover, .navLink.active { background: var(--crimsonDark); }
  .subMenu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--line); border-radius: 8px; min-width: 300px; padding: 6px; list-style: none; margin: 0; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .navItem:hover .subMenu, .navItem:focus-within .subMenu { display: block; }
  .subMenu a { display: block; padding: 7px 10px; color: var(--ink); text-decoration: none; border-radius: 5px; font-size: 14px; }
  .subMenu a:hover { background: var(--soft); }
  .menuToggle { display: none; background: none; border: 0; color: #fff; font-size: 26px; cursor: pointer; }

  /* Content */
  main { max-width: var(--maxWidth); margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 6px; }
  .subtitle { font-size: 21px; color: var(--muted); margin: 0 0 18px; font-weight: 500; }
  h2 { font-size: 24px; margin: 40px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--crimson); }
  h3 { font-size: 19px; margin: 28px 0 8px; }
  .byline { color: var(--muted); margin: 0 0 4px; }
  .metaRow { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 15px; margin: 6px 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 24px; padding: 0; list-style: none; }
  .chips li { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; }
  .chipsLabel { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .textBlock p { margin: 0 0 14px; }

  /* Figures */
  .imageGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0; }
  .imageGrid.single { grid-template-columns: 1fr; }
  .imageGrid img { width: 100%; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: var(--soft); }
  .caption { font-size: 14px; color: var(--muted); font-style: italic; margin: -6px 0 18px; }
  .caption p { margin: 0; }
  .frame { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); margin: 18px 0; background: var(--soft); }
  .frame.dashboard { height: 640px; }
  .frame.miniMap { height: 220px; margin: 8px 0 0; }

  /* Cards */
  .cardGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin: 18px 0 30px; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; background: #fff; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.1); }
  .card img { aspect-ratio: 16 / 10; object-fit: cover; width: 100%; }
  .cardBody { padding: 14px 16px 18px; }
  .cardBody h3 { margin: 0 0 6px; color: var(--crimson); }
  .cardBody p { margin: 0 0 8px; font-size: 15px; }
  .cardDate { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* Home */
  .hero { display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: start; margin-bottom: 20px; }
  .hero img { border-radius: var(--radius); }

  /* Resume */
  .job { border-left: 3px solid var(--crimson); padding: 2px 0 2px 16px; margin: 0 0 28px; }
  .job h3 { margin-top: 0; }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-height: 92vh; max-width: 96vw; border-radius: 6px; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 24px; border-top: 1px solid var(--line); }

  @media (max-width: 760px) {
    .menuToggle { display: block; }
    .navList { display: none; position: absolute; top: 60px; left: 0; right: 0; background: var(--crimson); flex-direction: column; padding: 8px 12px 14px; }
    .navList.open { display: flex; }
    .subMenu { display: block; position: static; box-shadow: none; border: 0; background: transparent; padding: 0 0 0 12px; min-width: 0; }
    .subMenu a { color: #ffdede; }
    .subMenu a:hover { background: var(--crimsonDark); }
    .hero { grid-template-columns: 1fr; }
    h1 { font-size: 27px; }
    .frame.dashboard { height: 520px; }
  }
</style>
</head>
<body>
<header class="siteHeader">
  <div class="headerInner">
    <a class="brand" href="#/page_5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
      Avery Durham · GIS Portfolio
    </a>
    <button class="menuToggle" aria-label="Open menu" id="menuToggle">&#9776;</button>
    <ul class="navList" id="navList"></ul>
  </div>
</header>
<main id="app"></main>
<footer>&copy; Avery Durham</footer>
<div class="lightbox" id="lightbox"><img alt=""></div>

<script id="siteData" type="application/json">__SITE_DATA__</script>
<script>
const siteData = JSON.parse(document.getElementById('siteData').textContent);
const homeId = 'page_5';
const hubIds = new Set(siteData.nav.map(n => n.id));
const app = document.getElementById('app');

const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const textOf = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };
const isYearRange = t => /^\d{4}\s*-\s*(\d{4}|current)$/i.test(t);

function buildNav() {
  const navList = document.getElementById('navList');
  navList.innerHTML = siteData.nav.map(n => {
    const label = n.id === homeId ? 'Home' : n.label;
    const subMenu = n.children.length
      ? `<ul class="subMenu">${n.children.map(c => `<li><a href="#/${c.id}">${escapeHtml(c.label)}</a></li>`).join('')}</ul>`
      : '';
    return `<li class="navItem"><a class="navLink" data-page="${n.id}" href="#/${n.id}">${escapeHtml(label)}</a>${subMenu}</li>`;
  }).join('');
  document.getElementById('menuToggle').onclick = () => navList.classList.toggle('open');
}

function renderImages(items) {
  const imgs = items.map(i => `<img loading="lazy" src="${i.src}" alt="${escapeHtml(i.alt || '')}">`).join('');
  return `<div class="imageGrid${items.length === 1 ? ' single' : ''}">${imgs}</div>`;
}

function renderMap(webmap, cls = '') {
  const src = `https://uofu.maps.arcgis.com/apps/instant/basic/index.html?webmap=${webmap}`;
  return `<iframe class="frame ${cls}" loading="lazy" src="${src}" title="Web map"></iframe>`;
}

function renderBlock(b) {
  switch (b.type) {
    case 'heading': return `<h2>${escapeHtml(b.text)}</h2>`;
    case 'text': return `<div class="textBlock">${b.html}</div>`;
    case 'caption': return `<div class="caption">${b.html}</div>`;
    case 'images': return renderImages(b.items);
    case 'embed': return `<iframe class="frame dashboard" loading="lazy" src="${b.src}" title="Dashboard"></iframe>`;
    case 'map': return renderMap(b.webmap);
    case 'meta': return `<div class="metaRow">${b.items.map(i => `<span>${escapeHtml(i)}</span>`).join('')}</div>`;
    case 'skills': return `<p class="chipsLabel">Key skills developed</p><ul class="chips">${b.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
    default: return '';
  }
}

/* Linked images on hub pages become cards: image + following title + description */
function renderWithCards(blocks) {
  let html = '', cards = [];
  const flush = () => { if (cards.length) { html += `<div class="cardGrid">${cards.join('')}</div>`; cards = []; } };
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    const linked = b.type === 'images' && b.items.length === 1 && b.items[0].page;
    if (linked) {
      let title = '', desc = '';
      if (blocks[i + 1]?.type === 'heading') { title = blocks[++i].text; }
      if (blocks[i + 1]?.type === 'text') { desc = blocks[++i].html; }
      const target = b.items[0].page;
      cards.push(`<a class="card" href="#/${target}"><img loading="lazy" src="${b.items[0].src}" alt=""><div class="cardBody"><h3>${escapeHtml(title || siteData.pages[target]?.label || '')}</h3>${desc}</div></a>`);
    } else {
      flush();
      html += renderBlock(b);
    }
  }
  flush();
  return html;
}

function renderHome(page) {
  const blocks = page.blocks;
  const title = blocks.find(b => b.type === 'heading');
  const firstImage = blocks.find(b => b.type === 'images');
  const about = blocks.find(b => b.type === 'text');
  let html = `<h1>${escapeHtml(title.text)}</h1><div class="hero">${renderImages(firstImage.items)}<div class="textBlock">${about.html}</div></div>`;
  /* The live homepage lays out three cards; their pieces appear in the same order, so zip them */
  const seen = new Set();
  const links = blocks.filter(b => b.type === 'heading' && b.link && !seen.has(b.link) && seen.add(b.link));
  const images = blocks.filter(b => b.type === 'images' && b !== firstImage);
  const dates = blocks.filter(b => b.type === 'heading' && isYearRange(b.text));
  const descs = blocks.filter(b => b.type === 'text' && b !== about);
  const cards = links.map((b, k) => {
    const image = images[k], date = dates[k], desc = descs[k];
    return `<a class="card" href="#/${b.link}">${image ? `<img loading="lazy" src="${image.items[0].src}" alt="">` : ''}<div class="cardBody">${date ? `<div class="cardDate">${escapeHtml(date.text)}</div>` : ''}<h3>${escapeHtml(b.text)}</h3>${desc ? desc.html : ''}</div></a>`;
  });
  html += `<div class="cardGrid">${cards.join('')}</div>`;
  return html;
}

function renderProject(page) {
  const blocks = [...page.blocks];
  let html = '';
  const first = blocks[0];
  if (first && first.type === 'text') {
    const lines = textOf(first.html.replace(/<\/p>|<br>/g, '\n')).split('\n').map(s => s.trim()).filter(Boolean);
    const course = lines[0].replace(/:$/, '');
    html += `<h1>${escapeHtml(lines.slice(1).join(' ') || course)}</h1><p class="subtitle">${escapeHtml(course)}</p>`;
    blocks.shift();
  }
  if (blocks[0]?.type === 'heading' && blocks[0].text === 'Avery Durham') {
    html += `<p class="byline">Avery Durham</p>`;
    blocks.shift();
  }
  return html + blocks.map(renderBlock).join('');
}

function renderResume(page) {
  const blocks = page.blocks;
  let html = '<h1>Resume</h1>';
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.type === 'map') continue;
    const nextIsJob = b.type === 'heading' && blocks[i + 1]?.type === 'map' && blocks[i + 2]?.type === 'text';
    const altJob = b.type === 'text' && blocks[i + 1]?.type === 'map' && blocks[i + 2]?.type === 'text';
    if (nextIsJob || altJob) {
      const jobTitle = b.type === 'heading' ? escapeHtml(b.text) : textOf(b.html);
      html += `<div class="job"><h3>${jobTitle}</h3><div class="textBlock">${blocks[i + 2].html}</div>${renderMap(blocks[i + 1].webmap, 'miniMap')}</div>`;
      i += 2;
    } else if (b.type === 'heading' && b.text === 'Resume') {
      continue;
    } else {
      html += renderBlock(b);
    }
  }
  return html;
}

function render() {
  const id = (location.hash.match(/page_\d+/) || [homeId])[0];
  const page = siteData.pages[id] || siteData.pages[homeId];
  let html;
  if (page.id === homeId) html = renderHome(page);
  else if (page.label === 'Resume') html = renderResume(page);
  else if (hubIds.has(page.id)) html = renderWithCards(page.blocks).replace('<h2>', '<h1>').replace('</h2>', '</h1>');
  else html = renderProject(page);
  app.innerHTML = html;
  document.title = page.id === homeId ? 'Avery Durham GIS Portfolio' : `${page.label} | Avery Durham GIS Portfolio`;
  document.querySelectorAll('.navLink').forEach(a => {
    const nav = siteData.nav.find(n => n.id === a.dataset.page);
    a.classList.toggle('active', nav && (nav.id === page.id || nav.children.some(c => c.id === page.id)));
  });
  document.getElementById('navList').classList.remove('open');
  window.scrollTo(0, 0);
}

const lightbox = document.getElementById('lightbox');
document.addEventListener('click', e => {
  if (e.target.matches('.imageGrid img')) {
    lightbox.querySelector('img').src = e.target.src;
    lightbox.classList.add('open');
  } else if (e.target.closest('#lightbox')) {
    lightbox.classList.remove('open');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

buildNav();
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
